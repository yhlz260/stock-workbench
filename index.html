function exportState(){
  const data = {positions:state.positions, realSetting:state.realSetting, sim:state.sim, savedAt:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spt持仓备份_'+MARKET.date.replace(/-/g,'')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast('已导出备份：'+state.positions.length+' 只持仓 + 模拟仓');
}
function importStateFile(file){
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d!=='object') throw new Error('bad');
      if(Array.isArray(d.positions)) state.positions = d.positions;
      if(d.realSetting && typeof d.realSetting==='object') state.realSetting = Object.assign({principal:0,principalSet:false}, d.realSetting);
      if(d.sim && typeof d.sim==='object') state.sim = Object.assign(state.sim, d.sim);
      save(); render();
      toast('已导入备份：'+state.positions.length+' 只持仓，本金 '+((state.realSetting.principalSet?state.realSetting.principal:0)/10000).toFixed(2)+'万');
    }catch(e){
      toast('备份文件解析失败，请确认是导出的 JSON 文件');
    }
  };
  fr.readAsText(file);
}
function bindExportImport(){
  const ex = document.getElementById('exportState');
  if(ex) ex.onclick = function(){ exportState(); };
  const im = document.getElementById('importState');
  if(im) im.onclick = function(){ document.getElementById('importFile').click(); };
  const ex2 = document.getElementById('exportStateSim');
  if(ex2) ex2.onclick = function(){ exportState(); };
  const im2 = document.getElementById('importStateSim');
  if(im2) im2.onclick = function(){ document.getElementById('importFile').click(); };
  const f = document.getElementById('importFile');
  if(f) f.onchange = function(e){ if(e.target.files && e.target.files[0]) importStateFile(e.target.files[0]); e.target.value=''; };
}

function closeMaskModal(){ document.getElementById('modalMask').classList.remove('show'); modalCtx=null; }
function initModal(){
  document.getElementById('modalCancel').onclick = closeMaskModal;
  document.getElementById('modalMask').onclick = (e)=>{ if(e.target.id==='modalMask') closeMaskModal(); };

}

function viewDaily(){
  // 综合所有池，按「打分+PA健康度+共振池数」加权，取综合推荐Top5
  const poolMap = poolDupMap();
  const merged = {};
  const TIER_PRIO = {'中长线':6,'红利低波':5,'波段':4,'短线':3,'小市值':2,'N字':3,'CCI':3,'ADX':3,'假阴':3,'一阳':3};
  const add = (arr, tier)=>{ (arr||[]).forEach(o=>{
    if(!o||!o.code) return;
    const code = o.code;
    if(!merged[code]){
      merged[code] = {code, name:o.name, now:o.now, chg:o.chg, buy:o.buy, target:o.target, stop:o.stop, note:o.note, tier, score:0, src:[], _prio:(TIER_PRIO[tier]||3)};
    }
    const curPrio = TIER_PRIO[tier]||3;
    if(curPrio>merged[code]._prio){ merged[code]._prio=curPrio; merged[code].tier=tier; }
    const base = num(o.score)!=null?o.score:60;
    if(base>merged[code].score) merged[code].score = base;
    if(!o.buy && merged[code].buy) {} 
    if(o.buy && !merged[code].buy) merged[code].buy = o.buy;
    if(o.target && !merged[code].target) merged[code].target = o.target;
    if(o.stop && !merged[code].stop) merged[code].stop = o.stop;
    if(o.note) merged[code].note = o.note;
    merged[code].src.push(tier);
  }); };
  add(DIVIDEND_POOL,'红利低波'); add(SMALLCAP_POOL,'小市值'); add(SWING_POOL,'波段');
  add(NZI_POOL,'N字'); add(CCI_POOL,'CCI'); add(ADX_POOL,'ADX');
  add(FAKEYIN_POOL,'假阴'); add(ONELINE_POOL,'一阳');
  add(TIERS.mid,'中长线'); add(TIERS.short,'短线');
  // 计算综合分：打分 + PA健康度(0-40) + 共振加成(每池+5，上限15)
  const rows = Object.values(merged).map(c=>{
    const pa = paScoreAny(c);
    const dupN = (poolMap[c.code]||[]).length;
    const paBonus = pa>=75?30 : pa>=60?22 : pa>=50?14 : 4;
    const dupBonus = Math.min(dupN,4)*5;
    const tierPrio = c.tier==='中长线'?6 : c.tier==='波段'?4 : c.tier==='红利低波'?5 : c.tier==='小市值'?3 : 2;
    c.pa = pa; c.dupN = dupN;
    c.total = c.score + paBonus + dupBonus + tierPrio;
    return c;
  }).sort((a,b)=>b.total-a.total).slice(0,5);

  const cards = rows.map((c,i)=>{
    const upPct = num(c.target)!=null && num(c.now) ? Math.round((c.target/c.now-1)*100) : null;
    const rr = num(c.target)!=null && num(c.now)!=null && num(c.stop) ? ((c.target-c.now)/(c.now-c.stop)).toFixed(1) : '—';
    const tierBadge = c.tier==='中长线'?'<span class="badge b-tier-mid">中长线</span>':c.tier==='红利低波'?'<span class="badge b-tier-mid">红利低波</span>':c.tier==='波段'?'<span class="badge b-tier-swing">波段</span>':c.tier==='小市值'?'<span class="badge b-tier-short">小市值</span>':'<span class="badge b-tier-short">短线</span>';
    const dupTxt = c.dupN>=3?`<span class="badge b-buy" style="font-size:12px;padding:2px 7px;">多战法共振·${c.dupN}池</span>`:(c.dupN>=2?`<span class="badge b-tag" style="font-size:12px;padding:2px 7px;">双战法·${c.dupN}池</span>`:'');
    return `
    <div class="card" style="padding:0;" data-code="${c.code}" data-name="${c.name}" style="cursor:pointer;">
      <div class="card-hd">
        <span class="t"><span class="rank" style="min-width:26px;height:26px;line-height:26px;font-size:14px;">${i+1}</span>${c.name} <span style="font-size:12px;color:var(--text3);font-weight:600;">${c.code}</span> ${dupTxt} ${tierBadge}</span>
        <span class="meta">综合分 <span class="money" style="font-size:16px;color:var(--purple);">${c.total}</span> · PA <span class="money" style="font-size:16px;color:${c.pa>=70?'var(--up)':c.pa>=55?'var(--accent)':'var(--down)'};">${c.pa}</span></span>
      </div>

      <div class="card-bd">
        <div class="pos-row">
          <div class="pos-item"><div class="l">现价</div><div class="v ${cls(c.chg)}">${c.now!=null?c.now.toFixed(2):'—'} <span style="font-size:12px;">${fmtChg(c.chg)}</span></div></div>
          <div class="pos-item"><div class="l">买入区间</div><div class="v down" style="font-size:15px;">${c.buy!=null?(typeof c.buy==='string'?c.buy:c.buy.toFixed(2)):'—'}</div></div>
          <div class="pos-item"><div class="l">止盈区间</div><div class="v up" style="font-size:15px;">${c.target!=null?(typeof c.target==='string'?c.target:c.target.toFixed(2)):'—'}</div></div>
          <div class="pos-item"><div class="l">空间/盈亏比</div><div class="v">${upPct!=null?'+'+upPct+'%':'—'} <span style="font-size:12px;color:var(--text3);">RR ${rr}:1</span></div></div>
        </div>
        <div style="font-size:12.5px;color:var(--text2);margin-top:12px;line-height:1.7;border-top:1px dashed rgba(217,224,242,.8);padding-top:10px;">
          <b style="color:var(--text);">买入理由：</b>${c.note||'—'}${c.src.length?` <span style="color:var(--text3);">（来源：${c.src.join(' / ')}）</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="view-title">今日综合推荐 · 表现排名 Top5</div>
  <div class="view-sub">${MARKET.date} · 综合「打分 + PA价格行为健康度 + 多战法共振」加权排名 · 每日收盘后滚动更新 · 提前埋伏、不追已涨停</div>
  <div class="kpi-row">
    <div class="kpi"><div class="l">评分口径</div><div class="v" style="font-size:17px;">打分+PA+共振</div><div class="s">PA≥75加权30 / ≥60加权22 / ≥50加权14</div></div>
    <div class="kpi"><div class="l">共振加成</div><div class="v accent" style="font-size:17px;">每池+5</div><div class="s">同票多池共振=多方信号验证</div></div>

/* ===== 方案B：运行时技术指标+买点自动计算引擎 =====
 * 页面只上传一次、链接固定；每次打开页面自动拉取最新行情+日K，
 * 计算 MA20/MA60/60日高低位/MACD/KDJ/CCI/ADX/WR/量比/换手，
 * 并按池类型规则化生成 买点/目标/止损/位置/趋势/状态。
 * 数据源：腾讯 qt.gtimg.cn 实时（JSONP）+ web.ifzq.gtimg.cn 日K（qfq）
 * 口径：与 calc_ind.py 一致（MACD12/26/9, KDJ9/3/3, CCI14, ADX14, WR14）
 */
(function(){
  // ---------- 技术指标计算（纯函数） ----------
  function eA(arr,n){var k=2/(n+1),o=[],p=null;for(var i=0;i<arr.length;i++){var v=arr[i];p=(p==null)?v:v*k+p*(1-k);o.push(p);}return o;}
  function sA(arr,n){var o=[],s=0;for(var i=0;i<arr.length;i++){s+=arr[i];if(i>=n)s-=arr[i-n];o.push(i>=n-1?s/n:null);}return o;}
  function mMacd(c){var e12=eA(c,12),e26=eA(c,26),d=c.map(function(_,i){return e12[i]-e26[i];});var dea=eA(d,9);return +d[d.length-1].toFixed(2);}
  function mKdj(b){var n=9,k1=3,k2=3,K=50,D=50;for(var i=0;i<b.length;i++){var hh=-Infinity,ll=Infinity;for(var j=Math.max(0,i-n+1);j<=i;j++){if(b[j][3]>hh)hh=b[j][3];if(b[j][4]<ll)ll=b[j][4];}var r=(hh===ll)?50:(b[i][2]-ll)/(hh-ll)*100;K=(k1-1)/k1*K+(1/k1)*r;D=(k2-1)/k2*D+(1/k2)*K;}return +K.toFixed(1);}
  function mCci(b){var n=14,tp=b.map(function(x){return (x[3]+x[4]+x[2])/3;}),ma=sA(tp,n),last=tp.length-1,st=Math.max(0,last-n+1),md=0,cnt=0;for(var i=st;i<=last;i++){md+=Math.abs(tp[i]-ma[last]);cnt++;}md=md/cnt;if(md===0)return 0;return +((tp[last]-ma[last])/(0.015*md)).toFixed(1);}
  function mTr(b){var o=[];for(var i=0;i<b.length;i++){var h=b[i][3],l=b[i][4],pc=i>0?b[i-1][2]:b[i][2];o.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}return o;}
  function mAdx(b){var n=14,pd=[],md=[],tr=mTr(b);for(var i=1;i<b.length;i++){var up=b[i][3]-b[i-1][3],dn=b[i-1][4]-b[i][4];pd.push((up>dn&&up>0)?up:0);md.push((dn>up&&dn>0)?dn:0);}var len=pd.length,pdi=[],mdi=[],dx=[],atr=0,ps=0,ms=0;for(var i=0;i<len;i++){var t=tr[i+1];if(i<n-1){atr+=t;ps+=pd[i];ms+=md[i];continue;}if(i===n-1){atr=(atr+t)/n;ps=(ps+pd[i])/n;ms=(ms+md[i])/n;}else{atr=(atr*(n-1)+t)/n;ps=(ps*(n-1)+pd[i])/n;ms=(ms*(n-1)+md[i])/n;}var pv=atr>0?ps/atr*100:0,mv=atr>0?ms/atr*100:0;pdi.push(pv);mdi.push(mv);var su=pv+mv;dx.push(su>0?Math.abs(pv-mv)/su*100:0);}if(!dx.length)return 0;var ad=dx.slice(0,Math.min(n,dx.length)).reduce(function(a,b){return a+b;},0)/Math.min(n,dx.length);for(var i=n;i<dx.length;i++){ad=(ad*(n-1)+dx[i])/n;}return +ad.toFixed(1);}
  function mWr(b){var n=14,last=b.length-1,hh=-Infinity,ll=Infinity;for(var j=Math.max(0,last-n+1);j<=last;j++){if(b[j][3]>hh)hh=b[j][3];if(b[j][4]<ll)ll=b[j][4];}if(hh===ll)return 50;return +((hh-b[last][2])/(hh-ll)*100).toFixed(1);}
  function mMa(c,n){var last=c.length-1;if(last<n-1)return null;var s=0;for(var i=last-n+1;i<=last;i++)s+=c[i];return +(s/n).toFixed(2);}
  function techCalc(b){
    var c=b.map(function(x){return x[2];});
    var l60=Infinity,h60=-Infinity;
    for(var i=Math.max(0,b.length-60);i<b.length;i++){if(b[i][4]<l60)l60=b[i][4];if(b[i][3]>h60)h60=b[i][3];}
    var now=+c[c.length-1].toFixed(2);
    var p60=(h60===l60)?50:(now-l60)/(h60-l60)*100;
    var chg20=(c.length>=21&&c[c.length-21]>0)?(c[c.length-1]/c[c.length-21]-1)*100:null;
    var l30=Infinity,h30=-Infinity;
    for(var j=Math.max(0,b.length-30);j<b.length;j++){if(b[j][4]<l30)l30=b[j][4];if(b[j][3]>h30)h30=b[j][3];}
    var p30=(h30===l30)?50:(now-l30)/(h30-l30)*100;
    return { last:b[b.length-1][0], now:now, macd:mMacd(c), kdj:mKdj(b), cci:mCci(b), adx:mAdx(b), wr:mWr(b),
      ma20:mMa(c,20), ma60:mMa(c,60), l60:+l60.toFixed(2), h60:+h60.toFixed(2), p60:+p60.toFixed(1), p30:+p30.toFixed(1), chg20:chg20 };
  }
  // ---------- 日K获取（腾讯 qfq，10分钟localStorage缓存） ----------
  function tCode(code){ code=String(code).replace(/\D/g,''); return (code.charAt(0)==='6'||code.charAt(0)==='9')?'sh'+code:'sz'+code; }
  function kCacheKey(code){ return 'spt_k1_'+code; }
  function kCacheGet(code){ try{ var o=JSON.parse(localStorage.getItem(kCacheKey(code))); if(o&&o.t&&(Date.now()-o.t)<600000&&o.b&&o.b.length) return o.b; }catch(e){} return null; }
  function kCacheSet(code,b){ try{ localStorage.setItem(kCacheKey(code), JSON.stringify({t:Date.now(), b:b})); }catch(e){} }
  function fetchKline(code){
    var cached = kCacheGet(code);
    if(cached) return Promise.resolve(cached);
    var url='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+tCode(code)+',day,,,150,qfq';
    return dF(url,'https://gu.qq.com/').then(function(j){
      var d=j&&j.data&&j.data[tCode(code)];
      var bars=(d&&(d.qfqday||d.day))||[];
      if(!bars.length) return null;
      var out=bars.map(function(x){return [x[0],parseFloat(x[1]),parseFloat(x[2]),parseFloat(x[3]),parseFloat(x[4]),parseFloat(x[5])||0];});
      kCacheSet(code,out); return out;

function drawSpark(canvas, code){
  if(!canvas) return;

  if(Math.abs(canvas.width-w0)>1||Math.abs(canvas.height-h0)>1){ canvas.width=w0; canvas.height=h0; }

    var ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
    var ps=m.rows.map(function(r){return r[1];});
    var mn=Math.min.apply(null,ps), mx=Math.max.apply(null,ps);
    if(mx-mn<1e-9){ mx=mn+0.01; }
    var prevClose=m.rows[0][2]||ps[0];
    var col = ps[ps.length-1]>=ps[0] ? '#e04848' : '#18a06b';
    ctx.clearRect(0,0,W,H);
    // 中线（昨收参考）

    var midY = H/2;

        var p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
        var c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
        var c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;

      ctx.stroke();
    }

      var y=H-3-(ps[i]-mn)/(mx-mn)*(H-6);
      pts.push({x:x,y:y});

    grad.addColorStop(1,'rgba(255,255,255,0)');

    ctx.beginPath(); ctx.moveTo(pts[0].x,H); 
    for(var i=0;i<pts.length-1;i++){
      var p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
      ctx.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y);
    }

    ctx.strokeStyle=col; ctx.lineWidth=1.3; ctx.lineJoin='round'; ctx.lineCap='round';

function chipDist(bars){
  var N=Math.min(120,bars.length), seg=50;
  var lo=Infinity,hi=-Infinity;
  for(var i=bars.length-N;i<bars.length;i++){ if(bars[i][3]>hi)hi=bars[i][3]; if(bars[i][4]<lo)lo=bars[i][4]; }
  if(hi-lo<1e-9) hi=lo+1;
  var step=(hi-lo)/seg, dist=new Array(seg).fill(0);
  for(var i=bars.length-N;i<bars.length;i++){
    var b=bars[i], o=b[1], c=b[2], h=b[3], l=b[4], v=b[5]||1;
    var sp=(h-l)||(c*0.01);
    var peak=c;
    for(var s=0;s<seg;s++){
      var price=lo+(s+0.5)*step;
      var w;
      if(price>=l&&price<=h){
        if(sp<1e-9){ w=1; }
        else { w=1-Math.abs(price-peak)/sp; w=Math.max(0,w); }
        dist[s]+=w*v;
      }
    }
  }
  var mx=Math.max.apply(null,dist); if(mx<1e-9) mx=1;
  var out=[]; for(var s=0;s<seg;s++){ out.push({price:+(lo+(s+0.5)*step).toFixed(2), pct:+(dist[s]/mx*100).toFixed(1)}); }
  return {lo:lo,hi:hi,dist:out};
}

function renderSignal(body){
  body.innerHTML='<div class="sec-t">关键价位 · 实时</div><div class="fin-grid" id="dSigGrid"></div><div class="sec-t">信号检查 · 日K（前复权）</div><div id="dSigChecks" style="display:flex;flex-direction:column;gap:6px;"></div><div class="dnote">价位=腾讯实时 · 信号=日K计算 · 页面打开时抓取 · 检查项用于辅助判断，非买卖指令</div>';
  var grid=document.getElementById('dSigGrid');
  var set=function(k,v,cl){ grid.insertAdjacentHTML('beforeend','<div class="fin-cell"><div class="k">'+k+'</div><div class="v" style="'+(cl||'')+'">'+v+'</div></div>'); };
  var checks=document.getElementById('dSigChecks');
  var chk=function(label,ok,detail){
    var col=ok?'var(--up)':'var(--down)';
    checks.insertAdjacentHTML('beforeend','<div style="display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:8px;padding:8px 10px;font-size:12.5px;"><span style="flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;background:'+col+';">'+(ok?'✓':'✕')+'</span><span style="flex:1;color:var(--text);">'+label+'</span><span style="font-size:11px;color:var(--text3);">'+detail+'</span></div>');
  };
  try{
    fetch('https://qt.gtimg.cn/q='+dT(dState.code),{headers:{'Referer':'https://gu.qq.com/'}}).then(function(r){return r.text();}).then(function(t){
      var f=String(t).split('=')[1]&&String(t).split('=')[1].split('~');
      if(f&&f.length>49){
        set('现价',f[3],(f[32]>=0?'color:var(--up)':'color:var(--down)'));
        set('涨跌幅',(f[32]>0?'+':'')+f[32]+'%',(f[32]>=0?'color:var(--up)':'color:var(--down)'));
        set('今开',f[5]); set('昨收',f[4]); set('最高',f[33]); set('最低',f[34]);
        set('成交额',fmtWan2(+f[37]*1e4)); set('换手率',f[38]+'%');
        set('量比',f[49]||'—'); set('振幅',f[43]+'%');
        set('市盈率(动)',f[39]); set('市净率',f[46]);
        set('总市值',(+f[45]||0).toFixed(0)+'亿'); set('流通市值',(+f[44]||0).toFixed(0)+'亿');
        set('涨停价',f[47]); set('跌停价',f[48]);
      }
    }).catch(function(){});
  }catch(e){}
  fetchKlinePeriod(dState.code,'day').then(function(bars){
    if(!bars||bars.length<20){ checks.insertAdjacentHTML('beforeend','<div style="font-size:12px;color:var(--text3);">日K数据获取失败</div>'); return; }
    var closes=bars.map(function(b){return b[2];});
    var now=+closes[closes.length-1].toFixed(2);
    var ma5v=seqMa(closes,5), ma20v=seqMa(closes,20), ma60v=seqMa(closes,60);
    var ma5=ma5v[ma5v.length-1], ma20=ma20v[ma20v.length-1], ma60=ma60v[ma60v.length-1];
    var h250=-Infinity; for(var i=Math.max(0,closes.length-250);i<closes.length;i++){ if(bars[i][3]>h250) h250=bars[i][3]; }
    var n250=Math.min(250,closes.length);
    var lo250=bars[bars.length-n250][4];
    var pos250=n250>1&&h250>lo250?((now-lo250)/(h250-lo250)*100):null;
    var draw250=h250>0?((now/h250-1)*100):null;
    var h60=-Infinity,l60=Infinity; for(var j=Math.max(0,closes.length-60);j<closes.length;j++){ if(bars[j][3]>h60)h60=bars[j][3]; if(bars[j][4]<l60)l60=bars[j][4]; }
    var pos60=(h60===l60)?50:((now-l60)/(h60-l60)*100);
    var macdArr=null; try{ macdArr=seqMacd(closes).macd; }catch(e){}
    var macdNow=macdArr&&macdArr.length?macdArr[macdArr.length-1]:null;
    var ma5Up=closes.length>=6?closes[closes.length-1]>closes[closes.length-6]:null;
    chk('站上 MA20', ma20!=null&&now>=ma20, ma20!=null?'MA20 '+ma20.toFixed(2):'—');
    chk('站上 MA60', ma60!=null&&now>=ma60, ma60!=null?'MA60 '+ma60.toFixed(2):'—');
    chk('MA5 向上', ma5Up===true, ma5Up?'最新收盘较5日前抬升':'最新收盘较5日前回落');
    chk('MACD 红柱区', macdNow!=null&&macdNow>0, macdNow!=null?'MACD '+macdNow.toFixed(2):'—');
    chk('60日位置 <40%（低吸区）', pos60<40, pos60.toFixed(0)+'%');
    chk('距250日高点回撤 <25%', draw250!=null&&draw250>-25, draw250!=null?draw250.toFixed(1)+'%':'—');
    chk('250日位置 中低位 <60%', pos250!=null&&pos250<60, pos250!=null?pos250.toFixed(0)+'%':'—');
    set('距250日高点', draw250!=null?draw250.toFixed(1)+'%':'—');
    set('250日位置', pos250!=null?pos250.toFixed(0)+'%':'—');
    set('60日位置', pos60.toFixed(0)+'%');
    set('MA5/20/60', (ma5!=null?ma5.toFixed(2):'—')+' / '+(ma20!=null?ma20.toFixed(2):'—')+' / '+(ma60!=null?ma60.toFixed(2):'—'));
  });
}
function fmtWan2(v){ if(v==null) return '—'; v=+v; if(Math.abs(v)>=1e8) return (v/1e8).toFixed(2)+'亿'; if(Math.abs(v)>=1e4) return (v/1e4).toFixed(2)+'万'; return v.toFixed(2); }
function renderFinance(body){

    set('每股净资产',r.BPS!=null?r.BPS.toFixed(2):'—');
    set('资产负债率',(r.ZCFZL!=null?r.ZCFZL.toFixed(2)+'%':'—'));
    set('每股经营现金流',r.MGJYXJJE!=null?r.MGJYXJJE.toFixed(2):'—');
    set('流动比率',r.LD!=null?r.LD.toFixed(2):'—');
    set('速动比率',r.SD!=null?r.SD.toFixed(2):'—');
  }).catch(function(){ set('财务数据','获取失败'); });
  // 实时估值（腾讯 qt）
  try{
    fetch('https://qt.gtimg.cn/q='+dT(dState.code),{headers:{'Referer':'https://gu.qq.com/'}}).then(function(r){return r.text();}).then(function(t){
      var f=String(t).split('=')[1]&&String(t).split('=')[1].split('~');
      if(f&&f.length>46){
        set('现价',f[3]); set('涨跌幅',(f[32]>0?'+':'')+f[32]+'%', f[32]>=0?'color:var(--up)':'color:var(--down)');
        set('换手率',f[38]+'%'); set('市盈率(动)',f[39]);
        set('振幅',f[43]+'%'); set('流通市值',(+f[44]||0).toFixed(0)+'亿'); set('总市值',(+f[45]||0).toFixed(0)+'亿');
        set('市净率',f[46]); set('量比',f[49]||'—');
      }
    }).catch(function(){});
  }catch(e){}
}

// ---- 全局：给带 data-code 的行/卡绑定点击详情 ----
function bindDetail(){
  document.querySelectorAll('[data-code]').forEach(function(el){
    if(el.__db) return; el.__db=1;
    el.addEventListener('click', function(e){
      if(e.target.closest('button')||e.target.closest('input')||e.target.closest('a')) return;
      var code=el.getAttribute('data-code');
      var name=el.getAttribute('data-name')||el.textContent.trim().slice(0,8);
      if(code) openDetail(code,name);
    });
  });
}
