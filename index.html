<!DOCTYPE html>
<html lang="zh-CN" style="margin:0;padding:0;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三重仓职业决策终端</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#eef2fb; --bg2:#e7ecfa; --card:rgba(255,255,255,.86); --card2:#f4f6fd;
  --border:#d9e0f2; --text:#1b2340; --text2:#4d5878; --text3:#8b94ad;
  --up:#e04848; --down:#18a06b; --accent:#e08a1e;
  --blue:#3f7ae0; --purple:#6d5ce8; --cyan:#2aa8c4;
  --grad:linear-gradient(120deg,#4f7cff,#8b5cf6 55%,#d45cf0);
  --grad-soft:linear-gradient(120deg,rgba(79,124,255,.10),rgba(139,92,246,.10));
  --shadow:0 6px 24px rgba(55,80,180,.08),0 1px 3px rgba(55,80,180,.06);
  --shadow-hover:0 10px 34px rgba(55,80,180,.14),0 2px 6px rgba(55,80,180,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;}
body{background:
  radial-gradient(1100px 480px at 12% -8%,rgba(79,124,255,.14),transparent 60%),
  radial-gradient(900px 420px at 88% -6%,rgba(139,92,246,.13),transparent 55%),
  radial-gradient(800px 500px at 50% 108%,rgba(42,168,196,.10),transparent 55%),
  var(--bg);}
a{color:inherit;text-decoration:none;}
.up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--text2);}
/* ===== 顶栏 ===== */
header{height:58px;display:flex;align-items:center;gap:20px;padding:0 22px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(217,224,242,.9);position:sticky;top:0;z-index:50;}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand-dot{width:12px;height:12px;border-radius:50%;background:var(--grad);box-shadow:0 0 14px rgba(111,98,244,.6);position:relative;}
.brand-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(111,98,244,.35);}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand span{font-size:11px;color:var(--text3);margin-left:4px;font-weight:700;letter-spacing:1px;}
.ticker{display:flex;align-items:center;gap:18px;flex:1;overflow:hidden;padding:0 8px;}
.tk{display:flex;align-items:baseline;gap:6px;white-space:nowrap;}
.tk .n{font-size:12px;color:var(--text2);}
.tk .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.tk .c{font-size:11px;font-variant-numeric:tabular-nums;}
.date-pill{font-size:12px;color:var(--text2);background:linear-gradient(120deg,rgba(79,124,255,.08),rgba(139,92,246,.08));padding:5px 12px;border-radius:16px;border:1px solid rgba(111,98,244,.25);white-space:nowrap;font-weight:600;}
.rt-pill{font-size:11px;color:var(--text2);background:linear-gradient(135deg,rgba(52,199,123,.12),rgba(10,132,255,.10));border:1px solid rgba(52,199,123,.4);border-radius:20px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;animation:rtPulse 2.4s ease-in-out infinite;}
.rt-pill::before{content:'';width:7px;height:7px;border-radius:50%;background:#34C77B;box-shadow:0 0 6px #34C77B;animation:rtPulseDot 1.6s ease-in-out infinite;}
@keyframes rtPulse{0%,100%{opacity:1}50%{opacity:.75}}
@keyframes rtPulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
/* ===== 布局 ===== */
.layout{display:flex;min-height:calc(100vh - 58px);}
nav{width:172px;flex-shrink:0;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-right:1px solid rgba(217,224,242,.9);padding:14px 10px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px 14px;font-size:13.5px;color:var(--text2);cursor:pointer;border-radius:10px;border-left:3px solid transparent;transition:all .18s;margin-bottom:3px;font-weight:600;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.9);box-shadow:var(--shadow);}
.nav-item.active{color:#fff;background:var(--grad);box-shadow:0 6px 18px rgba(111,98,244,.35);border-left-color:rgba(255,255,255,.85);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
main{flex:1;padding:22px 26px;min-width:0;overflow-x:auto;}
.view-title{font-size:20px;font-weight:800;margin-bottom:3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.3px;}
.view-sub{font-size:12.5px;color:var(--text2);margin-bottom:20px;}
/* ===== 通用卡片 ===== */
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(217,224,242,.85);border-radius:14px;margin-bottom:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .2s;}
.card:hover{box-shadow:var(--shadow-hover);}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:.55;}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(217,224,242,.75);}
.card-hd .t{font-size:14px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;}
.card-hd .t::before{content:'';width:4px;height:15px;border-radius:2px;background:var(--grad);}
.card-hd .meta{font-size:11.5px;color:var(--text3);}
.card-bd{padding:14px 18px;}
/* ===== 表格 ===== */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:11px 10px;font-size:11.5px;color:var(--text3);font-weight:700;border-bottom:1px solid rgba(217,224,242,.9);white-space:nowrap;background:linear-gradient(120deg,rgba(79,124,255,.05),rgba(139,92,246,.05));}
td{padding:11px 10px;border-bottom:1px solid rgba(217,224,242,.8);font-variant-numeric:tabular-nums;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(244,246,253,.7);}
.tnum{font-variant-numeric:tabular-nums;}
.money{font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px;}
/* ===== 指标标签 ===== */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.2px;}
.b-buy{background:linear-gradient(120deg,rgba(24,160,107,.16),rgba(24,160,107,.08));color:var(--down);box-shadow:inset 0 0 0 1px rgba(24,160,107,.25);}
.b-sell{background:linear-gradient(120deg,rgba(224,72,72,.16),rgba(224,72,72,.08));color:var(--up);box-shadow:inset 0 0 0 1px rgba(224,72,72,.25);}
.b-wait{background:linear-gradient(120deg,rgba(224,138,30,.16),rgba(224,138,30,.08));color:var(--accent);box-shadow:inset 0 0 0 1px rgba(224,138,30,.25);}
.rank{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:7px;background:var(--grad);color:#fff;font-size:12px;font-weight:800;margin-right:8px;box-shadow:0 3px 8px rgba(111,98,244,.3);}
.tag-lw{background:linear-gradient(120deg,rgba(24,160,107,.16),rgba(24,160,107,.08));color:var(--down);box-shadow:inset 0 0 0 1px rgba(24,160,107,.25);}
.tag-tp{background:linear-gradient(120deg,rgba(63,122,224,.16),rgba(63,122,224,.08));color:var(--blue);box-shadow:inset 0 0 0 1px rgba(63,122,224,.25);}
.b-tag{background:linear-gradient(120deg,rgba(63,122,224,.16),rgba(63,122,224,.08));color:var(--blue);box-shadow:inset 0 0 0 1px rgba(63,122,224,.25);}
.b-tier-mid{background:linear-gradient(120deg,rgba(139,92,246,.18),rgba(139,92,246,.08));color:var(--purple);box-shadow:inset 0 0 0 1px rgba(139,92,246,.3);}
.b-tier-swing{background:linear-gradient(120deg,rgba(224,138,30,.16),rgba(224,138,30,.08));color:var(--accent);box-shadow:inset 0 0 0 1px rgba(224,138,30,.25);}
.b-tier-short{background:linear-gradient(120deg,rgba(224,72,72,.16),rgba(224,72,72,.08));color:var(--up);box-shadow:inset 0 0 0 1px rgba(224,72,72,.25);}
/* ===== 指标格子 ===== */
.ind{display:inline-flex;flex-direction:column;align-items:center;gap:1px;}
.ind .v{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;}
.ind .l{font-size:10px;color:var(--text3);}
.ind-grid{display:flex;flex-wrap:wrap;gap:10px;}
/* ===== KPI ===== */
.g2{display:grid;grid-template-columns:1fr 1fr;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
.kpi{background:var(--card);backdrop-filter:blur(8px);border:1px solid rgba(217,224,242,.85);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:.5;}
.kpi .l{font-size:11.5px;color:var(--text3);margin-bottom:7px;font-weight:600;}
.kpi .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;}
.kpi .s{font-size:11.5px;margin-top:5px;font-variant-numeric:tabular-nums;color:var(--text2);}
/* ===== 操作按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid rgba(217,224,242,.9);background:rgba(255,255,255,.8);color:var(--text2);cursor:pointer;transition:all .15s;}
.btn:hover{border-color:var(--purple);color:var(--purple);box-shadow:0 3px 10px rgba(111,98,244,.15);}
.btn.buy{background:linear-gradient(120deg,rgba(24,160,107,.14),rgba(24,160,107,.06));border-color:rgba(24,160,107,.45);color:var(--down);}
.btn.buy:hover{background:linear-gradient(120deg,rgba(24,160,107,.24),rgba(24,160,107,.1));}
.btn.sell{background:linear-gradient(120deg,rgba(224,72,72,.14),rgba(224,72,72,.06));border-color:rgba(224,72,72,.45);color:var(--up);}
.btn.sell:hover{background:linear-gradient(120deg,rgba(224,72,72,.24),rgba(224,72,72,.1));}
.btn.sm{padding:3px 10px;font-size:11.5px;}
.mini-btn{display:inline-flex;align-items:center;justify-content:center;padding:3px 12px;border-radius:8px;font-size:11.5px;font-weight:700;border:1px solid rgba(24,160,107,.45);background:linear-gradient(120deg,rgba(24,160,107,.14),rgba(24,160,107,.06));color:var(--down);cursor:pointer;transition:all .15s;}
.mini-btn:hover{background:linear-gradient(120deg,rgba(24,160,107,.24),rgba(24,160,107,.1));box-shadow:0 3px 10px rgba(24,160,107,.2);}
/* ===== 持仓卡 ===== */
.pos-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px;}
.pos-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.pos-item .l{font-size:11.5px;color:var(--text3);}
.pos-item .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;}
/* ===== 波段监控 ===== */
.mon-bar{display:flex;align-items:center;gap:10px;}
.mon-bar .bar{flex:1;height:7px;background:var(--card2);border-radius:4px;position:relative;min-width:120px;}
.mon-bar .fill{height:100%;border-radius:4px;background:var(--grad);}
.mon-bar .pin{position:absolute;top:-3px;width:2px;height:13px;background:var(--accent);}
/* ===== 免责 ===== */
.disclaimer{font-size:11.5px;color:var(--text3);margin-top:22px;border-top:1px solid rgba(217,224,242,.9);padding-top:14px;line-height:1.8;}
/* ===== Toast ===== */
#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.96);border:1px solid rgba(111,98,244,.4);color:var(--text);font-size:13px;font-weight:700;padding:11px 24px;border-radius:12px;opacity:0;transition:opacity .25s;z-index:100;pointer-events:none;box-shadow:0 8px 30px rgba(55,80,180,.2);}
#toast.show{opacity:1;}
/* 模态框 */
.modal-mask{position:fixed;inset:0;background:rgba(15,22,45,.5);z-index:99;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-mask.show{display:flex;}
.modal{background:var(--card);backdrop-filter:blur(10px);border:1px solid rgba(217,224,242,.9);border-radius:16px;width:100%;max-width:360px;padding:20px;box-shadow:0 16px 50px rgba(30,50,120,.3);}
.modal h3{margin:0 0 4px;font-size:16px;color:var(--text);font-weight:800;}
.modal .sub{margin:0 0 14px;font-size:11.5px;color:var(--text3);}
.modal label{display:block;font-size:12.5px;color:var(--text2);margin:10px 0 4px;font-weight:600;}
.modal input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.9);border:1px solid rgba(217,224,242,.9);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;}
.modal input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(111,98,244,.12);}
.modal-btns{display:flex;gap:10px;margin-top:18px;}
.modal-btns .btn{flex:1;text-align:center;justify-content:center;}
/* 高亮发光辅助 */
.glow{box-shadow:0 0 0 1px rgba(111,98,244,.4),0 0 18px rgba(111,98,244,.25);}
/* 响应式 */
@media (max-width:1100px){
  body{overflow-x:hidden;}
  html,body{width:100%;max-width:100%;overflow-x:hidden;}
  .layout{flex-direction:column;}
  nav{width:100%;flex-direction:row;flex-wrap:wrap;padding:8px;}
  .nav-item{border-left:none;border-bottom:2px solid transparent;border-radius:8px;}
  .nav-item.active{border-bottom-color:transparent;}
  main{padding:12px;min-width:0;width:100%;box-sizing:border-box;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .ticker{display:none;}
  header{padding:0 12px;gap:10px;}
  .brand h1{font-size:14px;}
  .view-title{font-size:17px;}
  .view-sub{font-size:11.5px;margin-bottom:12px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:10px;}
  .kpi .v{font-size:19px;}
  .pos-row{grid-template-columns:repeat(2,1fr);}
  .pos-sum{grid-template-columns:1fr;}
  .card-hd{flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;}
  .card-bd{padding:12px 14px;}
  .card-bd{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .card-bd table{white-space:nowrap;}
  .mon-bar .bar{min-width:70px;}
  .disclaimer{font-size:11px;}
  .g2{grid-template-columns:1fr!important;}
}

/* ===== 信号捕捉：三色网格 ===== */
.sig-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:760px){.sig-board{grid-template-columns:repeat(2,1fr);}}
.sig-card{display:flex;flex-direction:column;gap:7px;padding:11px 13px;border-radius:13px;border:1.5px solid;min-width:0;}
.sig-card.red{border-color:rgba(255,77,79,.55);background:linear-gradient(130deg,rgba(255,77,79,.10),rgba(255,164,54,.06));}
.sig-card.green{border-color:rgba(52,199,123,.55);background:linear-gradient(130deg,rgba(52,199,123,.10),rgba(111,98,244,.05));}
.sig-card.yellow{border-color:rgba(233,161,61,.55);background:linear-gradient(130deg,rgba(233,161,61,.10),rgba(255,77,79,.04));}
.sig-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.sig-name{font-size:14.5px;font-weight:800;color:var(--text);}
.sig-code{font-size:11px;color:var(--text3);font-weight:600;}
.sig-tag{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;}
.sig-tag.mid{background:rgba(111,98,244,.12);color:#6f62f4;}
.sig-tag.sw{background:rgba(52,199,123,.12);color:#34c77b;}
.sig-tag.sh{background:rgba(255,77,79,.12);color:#ff4d4f;}
.sig-badge{font-size:10px;padding:1.5px 7px;border-radius:10px;font-weight:700;}
.sig-badge.red-b{background:rgba(255,77,79,.14);color:#e03a3c;}
.sig-badge.green-b{background:rgba(52,199,123,.14);color:#1f9e63;}
.sig-badge.yellow-b{background:rgba(233,161,61,.14);color:#c77f12;}
.sig-desc{font-size:11px;color:var(--text2);line-height:1.5;}
.sig-empty{padding:20px;text-align:center;color:var(--text3);font-size:13px;border:1.5px dashed rgba(138,146,168,.4);border-radius:14px;background:rgba(244,246,253,.4);}
.sig-bar{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--purple);background:rgba(111,98,244,.08);border:1px solid rgba(111,98,244,.25);border-radius:16px;padding:3px 12px;margin-bottom:10px;}
.sig-dot{width:7px;height:7px;border-radius:50%;background:#ff4d4f;animation:sigBlink 1s ease-in-out infinite;}
@keyframes sigBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
.sig-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--text2);}
.sig-legend .lg{display:inline-flex;align-items:center;gap:5px;}
.sig-legend .swatch{width:11px;height:11px;border-radius:3px;border:1.5px solid;}
.sig-legend .swatch.r{background:rgba(255,77,79,.25);border-color:rgba(255,77,79,.6);}
.sig-legend .swatch.g{background:rgba(52,199,123,.25);border-color:rgba(52,199,123,.6);}
.sig-legend .swatch.y{background:rgba(233,161,61,.25);border-color:rgba(233,161,61,.6);}

/* ===== 详情弹窗 + 迷你分时 ===== */
.spk{width:62%;max-width:210px;min-width:80px;height:26px;display:inline-block;vertical-align:middle;cursor:pointer;border-radius:5px;background:linear-gradient(180deg,#fff,#f5f8fc);border:1px solid rgba(210,218,236,.7);box-shadow:0 1px 3px rgba(80,100,160,.08);}
.spk-idx{width:118px;height:28px;display:inline-block;vertical-align:middle;cursor:pointer;border-radius:5px;background:linear-gradient(180deg,#fff,#f5f8fc);border:1px solid rgba(210,218,236,.7);margin-left:10px;}
.tr-detail{cursor:pointer;}
.kpi{position:relative;min-height:78px;}
.kpi .spk-idx{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:112px;height:28px;display:inline-block;vertical-align:middle;cursor:pointer;border-radius:5px;background:linear-gradient(180deg,#fff,#f5f8fc);border:1px solid rgba(210,218,236,.7);}
.kpi-row .kpi{padding-right:132px;}
.spk{width:62%;max-width:210px;min-width:80px;height:26px;display:inline-block;vertical-align:middle;cursor:pointer;border-radius:5px;background:linear-gradient(180deg,#fff,#f5f8fc);border:1px solid rgba(210,218,236,.7);box-shadow:0 1px 3px rgba(80,100,160,.08);}
.dmask{position:fixed;inset:0;background:rgba(15,23,52,.55);backdrop-filter:blur(3px);z-index:900;display:none;}
.dmask.on{display:block;}
.dbox{position:fixed;top:12px;left:12px;right:12px;bottom:12px;background:var(--bg);border:1px solid var(--border);border-radius:14px;z-index:901;display:none;flex-direction:column;box-shadow:0 12px 40px rgba(20,30,70,.35);overflow:hidden;}
.dbox.on{display:flex;}
.dhd{padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.dhd .nm{font-size:16px;font-weight:800;color:var(--text);}
.dhd .cd{font-size:11px;color:var(--text3);}
.dhd .px{font-size:17px;font-weight:800;}
.dhd .chg{font-size:12px;}
.dhd .close{margin-left:auto;background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;}
.dtabs{display:flex;gap:4px;padding:8px 14px 0;background:var(--card);border-bottom:1px solid var(--border);}
.dtab{padding:6px 14px;font-size:12px;border:1px solid var(--border);border-bottom:none;border-radius:9px 9px 0 0;background:var(--card2);color:var(--text2);cursor:pointer;}
.dtab.on{background:var(--bg);color:var(--text);font-weight:700;border-color:var(--accent);}
.dbody{flex:1;overflow:auto;padding:10px 14px;}
.chart-wrap{height:340px;width:100%;}
.chart-wrap.tall{height:420px;}
.sec-t{font-size:13px;font-weight:800;color:var(--text);margin:12px 0 6px;display:flex;align-items:center;gap:6px;}
.sec-t::before{content:'';width:4px;height:14px;background:var(--grad);border-radius:2px;}
.fin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.fin-cell{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 9px;}

<script>

// ===== 实时行情（腾讯公开接口 JSONP，无需积分） =====
var RT_STATE = { on:false, last:'--:--:--', err:'' };
function rtCode(code){
  code = String(code).replace(/\D/g,'');
  if(code.length<6) return '';
  var pre = (code.charAt(0)==='6'||code.charAt(0)==='9')?'sh':'sz';
  return pre+code;
}
function rtParseStr(str){
  // window['v_sh600869'] 的值： "1~名称~代码~现价~昨收~今开~..."
  if(!str) return null;
  var f = String(str).split('~');
  if(f.length<5) return null;
  return { code: f[2], now: parseFloat(f[3]), prev: parseFloat(f[4])||parseFloat(f[3]), amount: parseFloat(f[37])||0, turnover: parseFloat(f[38])||0, vr: parseFloat(f[49])||0, high: parseFloat(f[33])||0, low: parseFloat(f[34])||0 };
}
function rtApply(){
  // 更新持仓
  (state.positions||[]).forEach(function(p){
    var g = window['v_'+rtCode(p.code)];
    if(!g) return;
    var r = rtParseStr(g);
    if(r && r.now>0){
      var old = p.now;
      p.now = r.now;
      p.chg = r.prev>0 ? (r.now-r.prev)/r.prev*100 : p.chg;
      // 同步到硬编码 POSITIONS（仅当用户未手调）
      (POSITIONS||[]).forEach(function(pp){ if(pp.code===p.code && !pp.userTuned){ pp.now=r.now; pp.chg=p.chg; } });
    }
  });
  // 更新八个池 + TIERS 的 now/chg
  var pools = [DIVIDEND_POOL,SMALLCAP_POOL,NZI_POOL,CCI_POOL,ADX_POOL,SWING_POOL,FAKEYIN_POOL,ONELINE_POOL,FAREAST_POOL,SHORT_POOL];
  pools.forEach(function(pool){
    (pool||[]).forEach(function(s){
      var g = window['v_'+rtCode(s.code)];
      if(!g) return;
      var r = rtParseStr(g);
      if(r && r.now>0){ var old=s.now; s.now=r.now; s.chg = r.prev>0 ? (r.now-r.prev)/r.prev*100 : s.chg; }
      if(r && r.now>0){ if(r.turnover) s.turn=r.turnover; if(r.vr) s.vr=r.vr; if(s.ind){ if(r.turnover) s.ind.turnover=r.turnover; if(r.vr) s.ind.vr=r.vr; } }
    });
  });
  // TIERS 各层
  ['mid','swing','short'].forEach(function(k){
    (TIERS[k]||[]).forEach(function(s){
      var g = window['v_'+rtCode(s.code)];
      if(!g) return;
      var r = rtParseStr(g);
      if(r && r.now>0){ s.now=r.now; s.chg = r.prev>0 ? (r.now-r.prev)/r.prev*100 : s.chg; }
      if(r && r.now>0){ if(r.turnover) s.turn=r.turnover; if(r.vr) s.vr=r.vr; if(s.ind){ if(r.turnover) s.ind.turnover=r.turnover; if(r.vr) s.ind.vr=r.vr; } }
    });
  });
  // 指数
  var idxMap = { 'sh000001':0, 'sz399001':1, 'sz399006':2, 'sh000300':3 };
  Object.keys(idxMap).forEach(function(k){
    var g = window['v_'+k];
    if(!g) return;
    var r = rtParseStr(g);
    var i = idxMap[k];
    if(r && r.now>0 && MARKET.indices[i]){
      MARKET.indices[i].val = r.now;
      MARKET.indices[i].chg = r.prev>0 ? (r.now-r.prev)/r.prev*100 : MARKET.indices[i].chg;
    }
  });
  // 两市成交额实时（上证 + 深证综指，f37单位万元）
  var amtT = 0;
  ['sh000001','sz399106'].forEach(function(k){
    var g = window['v_'+k];
    if(!g) return;
    var r = rtParseStr(g);
    if(r && r.amount>0) amtT += r.amount;
  });
  if(amtT>0) MARKET.breadth.amount = fmtWan(amtT);
  // 更新日期为当天（实时数据日）
  try{
    var d = new Date();
    var wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    MARKET.date = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+wd;
  }catch(e){}
}
function rtCollect(){
  var codes = [];
  (state.positions||[]).forEach(function(p){ var c=rtCode(p.code); if(c && codes.indexOf(c)<0) codes.push(c); });
  var pools = [DIVIDEND_POOL,SMALLCAP_POOL,NZI_POOL,CCI_POOL,ADX_POOL,SWING_POOL,FAKEYIN_POOL,ONELINE_POOL,FAREAST_POOL,SHORT_POOL];
  pools.forEach(function(pool){ (pool||[]).forEach(function(s){ var c=rtCode(s.code); if(c && codes.indexOf(c)<0) codes.push(c); }); });
  ['mid','swing','short'].forEach(function(k){ (TIERS[k]||[]).forEach(function(s){ var c=rtCode(s.code); if(c && codes.indexOf(c)<0) codes.push(c); }); });
  codes.push('sh000001','sz399001','sz399006','sh000300','sz399106');
  return codes;
}
var RT_SCRIPTS = 0, RT_LOADED = 0, RT_TOTAL = 0;
var RT_FAIL = 0, RT_SCHED = null;
// 最小刷新间隔（盘中）：5000ms = 5秒
var RT_MIN_IV = 5000;
// 是否交易时段（工作日 9:15-11:35 / 12:55-15:05）
function rtInSession(){
  var d = new Date();
  var day = d.getDay();
  if(day===0||day===6) return false;
  var hm = d.getHours()*60 + d.getMinutes();
  return (hm>=555 && hm<=695) || (hm>=775 && hm<=905);
}
// 动态计算下次刷新间隔：盘中最小间隔，盘后降频，连续失败逐级退避
function rtNextInterval(){
  var iv = rtInSession() ? RT_MIN_IV : 60000;
  if(RT_FAIL>0){
    // 失败退避：5s→10s→20s→40s→60s 封顶
    var backoff = RT_MIN_IV * Math.pow(2, Math.min(RT_FAIL,4));
    if(backoff > 60000) backoff = 60000;
    if(backoff > iv) iv = backoff;
  }
  return iv;
}
// ===== 板块/涨跌停 实时刷新（东财接口；每6次行情刷新≈30秒拉一次，防风控）=====
var RT_SECTOR_CNT = 0;
function fmtWan(wan){
  if(!wan || wan<=0) return '-';
  var yi = wan/10000;
  if(yi>=10000) return (yi/10000).toFixed(2)+'万亿';
  return yi.toFixed(0)+'亿';
}
function ymdNow(){ var d=new Date(); return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function rtSectors(){
  RT_SECTOR_CNT++;
  if(RT_SECTOR_CNT % 6 !== 0) return; // 盘中5s×6≈30s一次
  var today = ymdNow();
  // 概念板块涨幅榜 TOP10（东财，CORS已放开）
  try{
    fetch('https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=12&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:3+f:!50&fields=f2,f3,f12,f14')
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.data && j.data.diff && j.data.diff.length){
          MARKET.sectors = j.data.diff.slice(0,10).map(function(x){ return {name:x.f14, chg:(typeof x.f3==='number')?x.f3:0}; });
          updOverviewDynamic();
        }
      }).catch(function(){});
  }catch(e){}
  // 涨停池（实时涨停家数 + 最高连板）
  try{
    fetch('https://push2ex.eastmoney.com/getTopicZTPool?ut=7eea3edcaed734bea9cbfc24409ed989&dpt=wz.ztzt&Pageindex=0&pagesize=10&sort=fbt:asc&date='+today)
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.data && j.data.pool){
          MARKET.breadth.limitUp = j.data.tc || 0;
          var mx = 1;
          (j.data.pool||[]).forEach(function(p){ if(p.lbc && p.lbc>mx) mx=p.lbc; });
          MARKET.breadth.maxBoard = mx;
          updOverviewDynamic();
        }
      }).catch(function(){});
  }catch(e){}
}
function updOverviewDynamic(){
  if(state.route!=='overview') return;
  var tb = document.getElementById('sectorRows');
  if(tb) tb.innerHTML = MARKET.sectors.map(function(s){ return '<tr><td>'+s.name+'</td><td class="money up">+'+s.chg.toFixed(2)+'%</td></tr>'; }).join('');
  var sm = document.getElementById('sectorMeta');
  if(sm && MARKET.sectors.length>=3){
    sm.textContent = '主线：'+MARKET.sectors.slice(0,3).map(function(s){return s.name;}).join('/')+' · 实时';
  }
  var bl = document.getElementById('bLimit');
  if(bl) bl.innerHTML = MARKET.breadth.limitUp+'<span class="up">↑</span> '+MARKET.breadth.limitDown+'<span class="down">↓</span>';
  var ba = document.getElementById('bAmount');
  if(ba) ba.textContent = MARKET.breadth.amount;
  var se = document.getElementById('sentMeta');
  if(se) se.textContent = '情绪偏活跃 · 实时涨停'+MARKET.breadth.limitUp+'家 · 最高连板'+((MARKET.breadth.maxBoard||1))+'板';
}
function rtScheduler(){
  var iv = rtNextInterval();
  RT_SCHED = setTimeout(function(){
    try{ rtLoad(); }catch(e){ rtFail(); }
    rtScheduler();
  }, iv);
}
function rtLoad(){
  var codes = rtCollect();
  // 分批，每批50
  var batches = [];
  for(var i=0;i<codes.length;i+=50) batches.push(codes.slice(i,i+50));
  RT_LOADED = 0; RT_TOTAL = batches.length;
  var holder = document.getElementById('rtScripts');
  if(!holder){ holder = document.createElement('div'); holder.id='rtScripts'; document.body.appendChild(holder); }
  holder.innerHTML = '';
  batches.forEach(function(batch){
    var s = document.createElement('script');
    s.src = 'https://qt.gtimg.cn/q='+batch.join(',');
    s.onload = function(){ RT_LOADED++; if(RT_LOADED>=RT_TOTAL) rtDone(); };
    s.onerror = function(){ RT_LOADED++; if(RT_LOADED>=RT_TOTAL) rtDone(); };
    holder.appendChild(s);
  });
  if(RT_TOTAL===0){ rtDone(); }
}
function rtDone(){
  rtApply();
  var d = new Date();
  RT_STATE.on = true;
  RT_STATE.last = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  RT_STATE.err = '';
  // 同步顶部日期与指数跑马灯
  var dp = document.getElementById('datePill');
  if(dp) dp.textContent = MARKET.date;
  var tk = document.getElementById('ticker');
  if(tk) tk.innerHTML = MARKET.indices.map(function(i){
    return '<div class="tk"><span class="n">'+i.name+'</span><span class="v '+cls(i.chg)+'">'+i.val.toFixed(2)+'</span><span class="c '+cls(i.chg)+'">'+fmtChg(i.chg)+'</span></div>';
  }).join('');
  RT_FAIL = 0;
  rtSectors();
  var iv = rtNextInterval();
  var ivTxt = iv<1000 ? Math.round(iv/1000)+'秒' : (iv/1000>=60 ? (iv/60000>=60 ? Math.round(iv/3600000)+'小时' : Math.round(iv/60000)+'分钟') : iv/1000+'秒');
  // 更新页面实时状态条
  var el = document.getElementById('rtStatus');
  if(el){ el.innerHTML = '实时已连接 · '+ivTxt+'刷新 · 最后更新 '+RT_STATE.last; el.style.display='inline-flex'; }
  // 全量渲染节流：15秒一次（数据仍5秒拉取）。模态框打开时跳过，防止输入卡顿；
  // 低频重建避免盘中按钮位置跳动导致误点/点击漂移
  var _n=Date.now();
  if(!window.__lastRtRender) window.__lastRtRender=0;
  if(!window.__modalOpen && _n-window.__lastRtRender>=15000){ window.__lastRtRender=_n; render(); }
}
function rtFail(){
  RT_STATE.on = false;
  RT_FAIL++;
  RT_STATE.err = '实时连接失败，显示收盘快照';
  var el = document.getElementById('rtStatus');
  if(el){ el.innerHTML = '<span style="color:#EA6668">实时连接失败 · '+RT_FAIL+'次 · 自动退避重连中</span>'; el.style.display='inline-flex'; }
}
function rtStart(){
  if(RT_SCHED) return; // 防重复启动
  try{ rtLoad(); }catch(e){ rtFail(); }
  rtScheduler();
  // 兜底：若10秒内未完成，降级
  setTimeout(function(){ if(RT_LOADED<RT_TOTAL && RT_TOTAL>0){ rtFail(); } }, 12000);
}

// ===== 数据（2026-09-03 收盘核验） =====
const MARKET = {
  date:'2026-09-11 周五',
  indices:[
    {name:'上证指数',code:'sh000001',val:3888.11,chg:-1.18},
    {name:'深证成指',code:'sz399001',val:13471.26,chg:-1.08},
    {name:'创业板指',code:'sz399006',val:3322.04,chg:-0.49},
    {name:'沪深300',code:'sh000300',val:4510.16,chg:-0.84},
  ],
  breadth:{up:605,down:4567,flat:0,limitUp:40,limitDown:21,breakRate:'—',amount:'1.97万亿'},
  sectors:[
    {name:'通信设备',chg:1.66},{name:'电力',chg:-0.09},{name:'银行',chg:-0.43},
    {name:'电子',chg:-0.81},{name:'军工',chg:-0.89},{name:'食品饮料',chg:-1.06},
    {name:'汽车',chg:-1.40},{name:'煤炭',chg:-1.48},

};

// ===== 市场择时信号（P2/P3 量化实证落地，每日收盘复盘任务更新）=====
// 依据：全市场pos60均值 IC -0.31——市场低位(pos≤0.45)未来20日6.03%/期 vs 高位-0.02%/期
// 状态三态：<0.40 超跌加仓 / 0.40-0.55 中性 / >0.55 高位防守；叠加20日动量修正
const MARKET_TIMING = {
    pos:0.216,        // 全市场pos60均值（0-1）2026-09-14重算（上证33.2%/深成9.6%/创业板10.4%加权近似21.6%）
    mom:-6.35,        // 全市场20日动量均值(%) 2026-09-14（上证-2.44%/深成-8.97%/创业板-12.15%加权）
    date:'2026-09-14 收盘',
    state:'超跌·左侧',
    advice:'全市场60日位置均值约21.6%，跌破0.40超跌区下沿，属深度超跌区；但三大指数20日动量为负（加权-6.35%），呈"超跌但趋势未转正"的左侧窗口。今日指数普跌但结构分化剧烈：涨停55家/跌停16家，医药CXO主线爆发（医疗研发外包+5.75%/创新药+3.31%），AI硬件PCB反弹（印制电路板+3.18%），权重补跌、题材活跃。建议：总仓维持结构内，不恐慌割肉也不一次性抄底；埋伏池按低吸区间分批埋伏（右侧确认才加仓），波段池等待企稳信号再介入，短线池只做放量突破确认；高波动票(年化>100%)降级回避。',
    src:'P2/P3实证：低位入场6.03%/期 vs 高位-0.02%/期 · 2026-09-14指数位置加权近似21.6%/20日动量-6.35%重算'
};;;
// ===== P0-1/P0-2 基本面排雷与安全垫（2026-09-11 新增，每日收盘任务更新）=====
// 数据来源：东方财富 mx_ashare_finance_data（2026中报/最新报告期）
// 排雷门槛：净利负增长 / 经营现金流为负 / 非金融负债率>70% / 质押>10% / 商誉>50亿 / 高波动年化>100%

// 信号置信度加权：胜率×盈亏比×期望收益，归一化到0-100
// 买入信号：ev>0才有效；卖出信号：ev<0（信号后下跌）才有效
function signalConfidence(sigName){
  const s = SIGNAL_BACKTEST[sigName];
  if(!s || s.noise || s.n < 30) return 0;
  // 买入信号：ev>0有效；卖出信号：ev<0有效（信号后下跌），取绝对值
  const evAbs = s.sell ? -s.ev : s.ev;
  if(evAbs <= 0) return 0;
  // 卖出信号胜率=下跌概率（已存为下跌概率）
  const wr = s.sell ? s.wr : s.wr;
  // 置信度 = 胜率×0.4 + 盈亏比归一化×0.3 + 期望收益归一化×0.3
  const wrScore = Math.min(wr / 60, 1) * 40;  // 60%胜率满分
  const plrScore = Math.min(s.plr / 2, 1) * 30;   // 2:1盈亏比满分
  const evScore = Math.min(evAbs / 3, 1) * 30;     // 3%期望满分
  return Math.round(wrScore + plrScore + evScore);
}
// 信号是否有效（非噪音且有正期望，卖出信号取反）
function signalValid(sigName){
  const s = SIGNAL_BACKTEST[sigName];
  if(!s || s.noise || s.n < 30) return false;
  return s.sell ? s.ev < 0 : s.ev > 0;
}
// 信号最佳持有期
function signalBestHold(sigName){
  const s = SIGNAL_BACKTEST[sigName];
  return s ? s.hold : 20;
}
// ===== P1-2 推荐-跟踪-复盘闭环（2026-09-11 新增）=====
// 模拟账本：记录每次系统推荐/用户买入，自动跟踪收益，月度归因哪类信号/池子在赚钱
// localStorage key: spt_rec_ledger_v1
const REC_KEY = 'spt_rec_ledger_v1';

// 读取推荐账本
function getRecLedger(){
  try {
    const raw = localStorage.getItem(REC_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

// 保存推荐账本
function saveRecLedger(ledger){
  try { localStorage.setItem(REC_KEY, JSON.stringify(ledger)); } catch(e){}
}

// 记录一次推荐/买入
function recordRecommendation(code, name, buyPrice, signals, pool, tier){
  const ledger = getRecLedger();
  const today = new Date().toISOString().slice(0,10);
  // 避免重复记录（同代码同日期）
  const exist = ledger.find(r => r.code === code && r.date === today);
  if(exist) return exist.id;
  const rec = {
    id: 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    date: today,
    code: code,
    name: name,
    buyPrice: buyPrice,
    currentPrice: buyPrice,
    signals: signals || [],
    pool: pool || '',
    tier: tier || '',
    status: 'open',  // open/closed
    closePrice: null,
    closeDate: null,
    maxGain: 0,
    maxLoss: 0,
    holdDays: 0,
  };
  ledger.push(rec);
  saveRecLedger(ledger);
  return rec.id;
}

// 更新推荐的现价（每日调用）
function updateRecPrices(priceMap){
  const ledger = getRecLedger();
  let changed = false;
  ledger.forEach(r => {
    if(r.status !== 'open') return;
    if(priceMap[r.code]){
      r.currentPrice = priceMap[r.code];
      const ret = (r.currentPrice - r.buyPrice) / r.buyPrice * 100;
      r.maxGain = Math.max(r.maxGain || 0, ret);
      r.maxLoss = Math.min(r.maxLoss || 0, ret);
      // 持有天数
      const d1 = new Date(r.date), d2 = new Date();
      r.holdDays = Math.floor((d2 - d1) / (1000*60*60*24));
      changed = true;
    }
  });
  if(changed) saveRecLedger(ledger);
  return ledger;
}

function closeRecommendation(recId, closePrice){
  const ledger = getRecLedger();
  const rec = ledger.find(r => r.id === recId);
  if(rec && rec.status === 'open'){
    rec.status = 'closed';
    rec.closePrice = closePrice;
    rec.closeDate = new Date().toISOString().slice(0,10);
    saveRecLedger(ledger);
  }
  return rec;
}

// 月度归因：统计某月份的推荐表现
function recommendationAttribution(month){
  const ledger = getRecLedger();
  const filtered = month ? ledger.filter(r => r.date.startsWith(month)) : ledger;
  if(filtered.length === 0) return {total: 0, winRate: 0, avgRet: 0, bySignal: {}, byPool: {}};
  
  let wins = 0, totalRet = 0;
  const bySignal = {}, byPool = {};
  
  filtered.forEach(r => {
    const ret = r.status === 'closed' 
      ? (r.closePrice - r.buyPrice) / r.buyPrice * 100
      : (r.currentPrice - r.buyPrice) / r.buyPrice * 100;
    if(ret > 0) wins++;
    totalRet += ret;
    
    // 按信号归因
    (r.signals || []).forEach(sig => {
      if(!bySignal[sig]) bySignal[sig] = {count: 0, wins: 0, totalRet: 0};
      bySignal[sig].count++;
      if(ret > 0) bySignal[sig].wins++;
      bySignal[sig].totalRet += ret;
    });
    
    // 按池子归因
    if(r.pool){
      if(!byPool[r.pool]) byPool[r.pool] = {count: 0, wins: 0, totalRet: 0};
      byPool[r.pool].count++;
      if(ret > 0) byPool[r.pool].wins++;
      byPool[r.pool].totalRet += ret;
    }
  });
  
  // 计算胜率和平均
  Object.keys(bySignal).forEach(k => {
    bySignal[k].winRate = Math.round(bySignal[k].wins / bySignal[k].count * 100);
    bySignal[k].avgRet = Math.round(bySignal[k].totalRet / bySignal[k].count * 100) / 100;
  });
  Object.keys(byPool).forEach(k => {
    byPool[k].winRate = Math.round(byPool[k].wins / byPool[k].count * 100);
    byPool[k].avgRet = Math.round(byPool[k].totalRet / byPool[k].count * 100) / 100;
  });
  
  return {
    total: filtered.length,
    open: filtered.filter(r => r.status === 'open').length,
    closed: filtered.filter(r => r.status === 'closed').length,
    winRate: Math.round(wins / filtered.length * 100),
    avgRet: Math.round(totalRet / filtered.length * 100) / 100,
    bySignal: bySignal,
    byPool: byPool,
  };
}

// 多信号共振置信度：各信号置信度加权求和，上限100
function resonanceConfidence(sigNames){
  if(!sigNames || sigNames.length === 0) return 0;
  let total = 0;
  sigNames.forEach(n => { total += signalConfidence(n); });
  return Math.min(Math.round(total * 0.7), 100);  // 多信号衰减系数0.7
}

// ===== P2 组合级风控（2026-09-11 新增）=====
// 1. ATR动态仓位：根据波动率计算建议仓位，而非固定百分比
// 2. 组合风控：行业集中度上限30%、月回撤>8%降仓提醒
// 3. 移动止盈：盈利后止损线上移到 最高价-2×ATR

// 计算ATR（14日平均真实波幅）
function calcATR(klines, period=14){
  if(!klines || klines.length < period+1) return null;
  const trs = [];
  for(let i=1; i<klines.length; i++){
    const h = parseFloat(klines[i][3]), l = parseFloat(klines[i][4]);
    const pc = parseFloat(klines[i-1][2]);
    const tr = Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc));
    trs.push(tr);
  }
  if(trs.length < period) return null;
  // 简单移动平均
  const recent = trs.slice(-period);
  return recent.reduce((a,b)=>a+b,0)/period;
}

// ATR动态仓位计算
// 风险预算：单票风险≤1%总资产；止损距离=2×ATR
// 建议仓位(股数) = (总资产 × 风险比例) / (2×ATR)
function calcATRPosition(code, totalAsset, riskPct=0.01){
  const kl = window['_kl_'+code] || null;
  if(!kl) return {atr:null, suggestedShares:null, riskPerShare:null, note:'暂无K线数据'};
  const atr = calcATR(kl);
  if(!atr || atr<=0) return {atr:null, suggestedShares:null, riskPerShare:null, note:'ATR计算失败'};
  const stopDist = 2 * atr;  // 2倍ATR止损
  const riskAmount = totalAsset * riskPct;
  const shares = Math.floor(riskAmount / stopDist / 100) * 100;  // 取整到100股
  return {
    atr: atr.toFixed(2),
    stopDist: stopDist.toFixed(2),
    riskPerShare: stopDist.toFixed(2),
    suggestedShares: shares,
    suggestedValue: (shares * (kl[kl.length-1][2])).toFixed(0),
    note: `2×ATR止损=${stopDist.toFixed(2)}元，风险${(riskPct*100).toFixed(0)}%总资产`
  };
}

// 移动止盈/ATR跟踪止损
// 盈利后，止损线上移到 持仓期最高价 - 2×ATR
function calcTrailingStop(code, cost, currentPrice, highSinceEntry){
  const kl = window['_kl_'+code] || null;
  if(!kl) return {trailingStop:null, note:'暂无K线数据'};
  const atr = calcATR(kl);
  if(!atr) return {trailingStop:null, note:'ATR计算失败'};
  const pnlPct = (currentPrice - cost) / cost * 100;
  // 初始止损 = 成本 - 2×ATR
  const initialStop = cost - 2*atr;
  // 盈利超过5%后，启动移动止盈
  if(pnlPct >= 5){
    const trailingStop = highSinceEntry - 2*atr;
    const activeStop = Math.max(initialStop, trailingStop);
    return {
      trailingStop: activeStop.toFixed(2),
      initialStop: initialStop.toFixed(2),
      highSinceEntry: highSinceEntry.toFixed(2),
      atr: atr.toFixed(2),
      active: true,
      note: `移动止盈已启动：最高价${highSinceEntry.toFixed(2)}-2×ATR=${activeStop.toFixed(2)}`
    };
  }
  return {
    trailingStop: initialStop.toFixed(2),
    initialStop: initialStop.toFixed(2),
    atr: atr.toFixed(2),
    active: false,
    note: `初始止损=成本-2×ATR=${initialStop.toFixed(2)}，盈利5%后启动移动止盈`
  };
}

// 组合风控分析
function portfolioRiskAnalysis(positions, totalAsset){
  if(!positions || positions.length === 0) return {industryConcentration:{}, maxIndustryPct:0, monthlyDD:0, warnings:[], advice:'暂无持仓'};
  
  // 行业集中度（简化：根据代码前缀和名称估算行业）
  const industryMap = {};
  positions.forEach(p => {
    const ind = p.industry || estimateIndustry(p.code, p.name);
    if(!industryMap[ind]) industryMap[ind] = {value:0, count:0, stocks:[]};
    const value = (p.now || p.cost) * (p.shares || 0);
    industryMap[ind].value += value;
    industryMap[ind].count += 1;
    industryMap[ind].stocks.push(p.name);
  });
  
  const totalValue = Object.values(industryMap).reduce((a,b)=>a+b.value,0) || 1;
  let maxIndustry = '', maxPct = 0;
  Object.entries(industryMap).forEach(([ind, data]) => {
    data.pct = (data.value/totalValue*100).toFixed(1);
    if(data.value/totalValue > maxPct){
      maxPct = data.value/totalValue;
      maxIndustry = ind;
    }
  });
  
  // 月回撤估算（简化：根据持仓的最大回撤估算）
  let monthlyDD = 0;
  positions.forEach(p => {
    if(p.maxDD && p.weight) monthlyDD += Math.abs(p.maxDD) * p.weight;
  });
  if(monthlyDD === 0) monthlyDD = 5; // 默认估算
  
  // 风控警告
  const warnings = [];
  if(maxPct > 0.30){
    warnings.push(`行业集中度超限：${maxIndustry}占比${(maxPct*100).toFixed(1)}%（上限30%），建议分散`);
  }
  if(monthlyDD > 8){
    warnings.push(`组合月回撤${monthlyDD.toFixed(1)}%>8%，触发降仓提醒，建议降至半仓以下`);
  }
  if(positions.length > 8){
    warnings.push(`持仓数量${positions.length}只>8只，管理难度增加，建议精简到5-8只`);
  }
  
  // 总仓位建议
  const gate = typeof MARKET_GATE !== 'undefined' ? MARKET_GATE : {regime:'未知', totalCap:'50-60%'};
  let advice = '';
  if(gate.regime && gate.regime.indexOf('超跌')>=0){
    advice = '超跌窗口：可进攻加仓，但单票仓位用ATR动态计算，避免集中';
  } else if(gate.regime && gate.regime.indexOf('高位')>=0){
    advice = '高位防守：降仓不追高，移动止盈保护利润';
  } else {
    advice = '中性结构市：维持仓位结构，按纪律执行';
  }
  
  return {
    industryConcentration: industryMap,
    maxIndustry: maxIndustry,
    maxIndustryPct: (maxPct*100).toFixed(1),
    monthlyDD: monthlyDD.toFixed(1),
    warnings: warnings,
    advice: advice,
    positionCount: positions.length,
    totalValue: totalValue.toFixed(0)
  };
}

// 估算行业（简化版）
function estimateIndustry(code, name){
  const c = String(code);
  if(c.indexOf('600')===0 || c.indexOf('601')===0 || c.indexOf('603')===0 || c.indexOf('605')===0){
    if(name.indexOf('银行')>=0) return '银行';
    if(name.indexOf('证券')>=0 || name.indexOf('金融')>=0) return '非银金融';
    if(name.indexOf('医药')>=0 || name.indexOf('生物')>=0 || name.indexOf('医疗')>=0) return '医药生物';
    if(name.indexOf('电子')>=0 || name.indexOf('科技')>=0 || name.indexOf('半导体')>=0) return '电子';
    if(name.indexOf('电力')>=0 || name.indexOf('能源')>=0 || name.indexOf('石油')>=0) return '公用事业/能源';
    if(name.indexOf('材料')>=0 || name.indexOf('化工')>=0 || name.indexOf('有色')>=0) return '化工/材料';
    return '沪市主板';
  }
  if(c.indexOf('000')===0 || c.indexOf('001')===0 || c.indexOf('002')===0 || c.indexOf('003')===0){
    if(name.indexOf('医药')>=0 || name.indexOf('生物')>=0 || name.indexOf('医疗')>=0) return '医药生物';
    if(name.indexOf('电子')>=0 || name.indexOf('科技')>=0 || name.indexOf('半导体')>=0) return '电子';
    if(name.indexOf('电力')>=0 || name.indexOf('能源')>=0) return '公用事业';
    if(name.indexOf('材料')>=0 || name.indexOf('化工')>=0) return '化工/材料';
    return '深市主板';
  }
  if(c.indexOf('300')===0 || c.indexOf('301')===0) return '创业板';
  if(c.indexOf('688')===0) return '科创板';
  return '其他';
}

// 超跌(pos<0.40)：可进攻加仓，埋伏池优先低吸，波段池可介入，短线池放量突破
// 中性(0.40-0.55)：维持结构，按纪律执行
// 高位(pos>0.55)：防守降仓，只低吸不追高，短线池空仓，追强信号屏蔽
// 叠加20日动量：动量为负时即使超跌也只左侧分批，不一次性抄底
const MARKET_GATE = (function(){
  const mt = MARKET_TIMING;
  const pos = mt.pos || 0.5;
  const mom = mt.mom || 0;
  let regime, totalCap, chaseAllowed, shortAllowed, advice;
  if(pos < 0.40){
    regime = '超跌·进攻窗口';
    totalCap = mom < 0 ? '60-70%(左侧分批)' : '70-80%(可进攻)';
    chaseAllowed = false;
    shortAllowed = true;
    advice = '超跌区：埋伏池按低吸区间分批埋伏，波段池等企稳信号介入，短线池只做放量突破确认；动量为负时不一次性抄底';
  } else if(pos <= 0.55){
    regime = '中性·结构市';
    totalCap = '50-60%';
    chaseAllowed = true;
    shortAllowed = true;
    advice = '中性区：按三层仓结构执行，埋伏+波段为主，短线控制仓位';
  } else {
    regime = '高位·防守';
    totalCap = '30-50%(降仓)';
    chaseAllowed = false;
    shortAllowed = false;
    advice = '高位区：只低吸不追高，短线池空仓，追强信号屏蔽，逐步降仓锁定利润';
  }
  return {regime, totalCap, chaseAllowed, shortAllowed, advice, pos, mom, date:mt.date};
})();

// 主力资金数据（占位，由每日定时任务拉取东方财富/同花顺主力资金数据填充）
// 格式：{code: {netInflow: 主力净流入(万), netInflowPct: 净流入占比, superLarge: 超大单, large: 大单, medium: 中单, small: 小单, date: 'YYYY-MM-DD'}}
const MAIN_FUND = {};

// 获取主力资金标签
function fundBadge(code){
  const f = MAIN_FUND[code];
  if(!f) return '<span class="badge" style="background:rgba(158,172,234,.1);color:var(--text3);font-size:10px;">资金待更新</span>';
  const net = f.netInflow || 0;
  if(net > 5000) return '<span class="badge" style="background:rgba(38,148,84,.15);color:#269454;font-size:10px;">主力大幅流入</span>';
  if(net > 1000) return '<span class="badge" style="background:rgba(38,148,84,.1);color:#269454;font-size:10px;">主力净流入</span>';
  if(net < -5000) return '<span class="badge" style="background:rgba(196,66,66,.15);color:#C44242;font-size:10px;">主力大幅流出</span>';
  if(net < -1000) return '<span class="badge" style="background:rgba(196,66,66,.1);color:#C44242;font-size:10px;">主力净流出</span>';
  return '<span class="badge" style="background:rgba(140,148,160,.1);color:var(--text3);font-size:10px;">资金中性</span>';
}

// 结构化综合研判（P3核心）
// 输入：code, name, 可选的技术面/基本面/事件面数据
// 输出：综合评分(0-100) + 各维度评分 + 研判结论
// 原则：所有数据由系统客观计算，LLM只做汇总，不做数据计算
function comprehensiveAnalysis(code, name, opts){
  opts = opts || {};
  
  // ===== 维度1：技术面（0-30分）=====
  let techScore = 15;
  let techDetails = [];
  
  // 从三池数据中获取技术指标
  const poolData = findByCodeOrName(code);
  if(poolData){
    const ind = poolData.ind || {};
    // MACD金叉/拐头 +5
    if(ind.macd > 0){ techScore += 3; techDetails.push('MACD金叉'); }
    // KDJ低位金叉 +3
    if(ind.kdj != null && ind.kdj < 30){ techScore += 2; techDetails.push('KDJ低位'); }
    // CCI>100强势 +3
    if(ind.cci > 100){ techScore += 3; techDetails.push('CCI强势'); }
    // ADX>25趋势明确 +3
    if(ind.adx >= 25){ techScore += 2; techDetails.push('ADX趋势'); }
    // 均线多头（MA20>MA60）+4
    if(poolData.ma20 && poolData.ma60 && poolData.ma20 > poolData.ma60){ techScore += 4; techDetails.push('均线多头'); }
    // 60日位置低位（<40）+5
    if(poolData.pos60 != null && poolData.pos60 < 40){ techScore += 5; techDetails.push('60日低位'); }
    // 量比>1.5放量 +3
    if(poolData.vr > 1.5){ techScore += 3; techDetails.push('放量'); }
    // Vegas多头 +3
    if(poolData.vg && poolData.vg.st === 'multi'){ techScore += 3; techDetails.push('Vegas多头'); }
    techScore = Math.min(techScore, 30);
  }
  
  // ===== 维度2：基本面（0-25分）=====
  let fundScore = 12;
  let fundDetails = [];
  
  const fs = FUNDAMENTAL_SCREEN ? FUNDAMENTAL_SCREEN[code] : null;
  if(fs){
    // 净利正增长 +5
    if(fs.netProfitGrowth != null && fs.netProfitGrowth > 0){ fundScore += 5; fundDetails.push('净利正增长'); }
    // 经营现金流为正 +4
    if(fs.operatingCashFlow > 0){ fundScore += 4; fundDetails.push('现金流正'); }
    // 资产负债率合理（<60%）+3
    if(fs.debtRatio != null && fs.debtRatio < 60){ fundScore += 3; fundDetails.push('负债率合理'); }
    // 质押比例低（<30%）+3
    if(fs.pledgeRatio != null && fs.pledgeRatio < 30){ fundScore += 3; fundDetails.push('质押低'); }
    // 商誉/净资产低（<20%）+3
    if(fs.goodwillRatio != null && fs.goodwillRatio < 20){ fundScore += 3; fundDetails.push('商誉低'); }
    // 硬排除 -10
    if(fs.hardBlock){ fundScore -= 10; fundDetails.push('⚠️排雷硬排除'); }
    fundScore = Math.max(0, Math.min(fundScore, 25));
  } else {
    fundDetails.push('基本面数据待更新');
  }
  
  // ===== 维度3：事件面（0-20分）=====
  let eventScore = 10;
  let eventDetails = [];
  
  // 未来60日大额解禁 -5
  // 重要股东减持 -5
  // 业绩预告利好 +5
  // 研报上调 +3
  // 这些数据由定时任务拉取公告填充，目前占位
  eventDetails.push('事件面数据待更新');
  
  // ===== 维度4：主力资金（0-15分）=====
  let fundFlowScore = 7;
  let fundFlowDetails = [];
  
  const mf = MAIN_FUND[code];
  if(mf){
    if(mf.netInflow > 5000){ fundFlowScore += 8; fundFlowDetails.push('主力大幅流入'); }
    else if(mf.netInflow > 1000){ fundFlowScore += 5; fundFlowDetails.push('主力净流入'); }
    else if(mf.netInflow < -5000){ fundFlowScore -= 8; fundFlowDetails.push('主力大幅流出'); }
    else if(mf.netInflow < -1000){ fundFlowScore -= 5; fundFlowDetails.push('主力净流出'); }
    fundFlowScore = Math.max(0, Math.min(fundFlowScore, 15));
  } else {
    fundFlowDetails.push('资金数据待更新');
  }
  
  // ===== 维度5：信号共振（0-10分）=====
  let signalScore = 5;
  let signalDetails = [];
  
  if(poolData && poolData.kf){
    const signalMatch = poolData.kf.match(/信号(\d+)/);
    if(signalMatch){
      const sigCount = parseInt(signalMatch[1]);
      signalScore = Math.min(sigCount * 2, 10);
      signalDetails.push(`${sigCount}条信号共振`);
    }
  }
  
  // ===== 综合评分 =====
  const totalScore = techScore + fundScore + eventScore + fundFlowScore + signalScore;
  
  // 研判结论（基于评分，客观规则）
  let conclusion, level;
  if(totalScore >= 75){
    level = '强烈关注';
    conclusion = '多维度共振，技术面+基本面+资金面均向好，可重点关注';
  } else if(totalScore >= 60){
    level = '积极关注';
    conclusion = '多数维度向好，存在结构性机会，可纳入观察池';
  } else if(totalScore >= 45){
    level = '中性观察';
    conclusion = '多维度分化，需等待更明确的信号，暂不急于介入';
  } else if(totalScore >= 30){
    level = '谨慎观望';
    conclusion = '多数维度偏弱，存在风险因素，建议回避或等待';
  } else {
    level = '回避';
    conclusion = '多维度走弱，风险较大，建议回避';
  }
  
  return {
    totalScore: totalScore,
    level: level,
    conclusion: conclusion,
    dimensions: {
      tech: {score: techScore, max: 30, details: techDetails},
      fundamental: {score: fundScore, max: 25, details: fundDetails},
      event: {score: eventScore, max: 20, details: eventDetails},
      fundFlow: {score: fundFlowScore, max: 15, details: fundFlowDetails},
      signal: {score: signalScore, max: 10, details: signalDetails}
    },
    timestamp: new Date().toISOString().slice(0,10)
  };
}

// 渲染综合研判卡
function viewComprehensiveAnalysis(code, name){
  const result = comprehensiveAnalysis(code, name);
  const scoreColor = result.totalScore >= 60 ? 'var(--up)' : result.totalScore >= 45 ? 'var(--accent)' : 'var(--down)';
  
  let html = '<div class="card"><div class="card-hd"><span class="t">综合研判 · P3级</span><span class="meta">技术面+基本面+事件面+资金面+信号，数据客观计算</span></div><div class="card-bd">';
  
  // 综合评分
  html += '<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">';
  html += `<div style="text-align:center;"><div style="font-size:36px;font-weight:800;color:${scoreColor};">${result.totalScore}</div><div style="font-size:11px;color:var(--text3);">综合评分/100</div></div>`;
  html += `<div style="flex:1;"><div style="font-size:14px;font-weight:600;margin-bottom:4px;">${result.level}</div><div style="font-size:12px;color:var(--text2);line-height:1.6;">${result.conclusion}</div></div>`;
  html += '</div>';
  
  // 五维度评分条
  html += '<div style="display:flex;flex-direction:column;gap:8px;">';
  const dims = [
    {key:'tech', label:'技术面', color:'#9EACEA'},
    {key:'fundamental', label:'基本面', color:'#94D8C3'},
    {key:'event', label:'事件面', color:'#E1B98F'},
    {key:'fundFlow', label:'资金面', color:'#F4B393'},
    {key:'signal', label:'信号共振', color:'#DEBEF8'}
  ];
  dims.forEach(d => {
    const dim = result.dimensions[d.key];
    const pct = (dim.score / dim.max * 100).toFixed(0);
    html += `<div style="display:flex;align-items:center;gap:8px;">
      <div style="width:60px;font-size:11px;color:var(--text2);">${d.label}</div>
      <div style="flex:1;height:8px;background:rgba(0,0,0,.05);border-radius:4px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${d.color};border-radius:4px;"></div>
      </div>
      <div style="width:40px;text-align:right;font-size:11px;font-weight:600;">${dim.score}/${dim.max}</div>
    </div>`;
    if(dim.details.length > 0){
      html += `<div style="font-size:10px;color:var(--text3);margin-left:68px;margin-top:-4px;">${dim.details.join(' · ')}</div>`;
    }
  });
  html += '</div>';
  
  html += '</div></div>';
  return html;
}

function judgeRegime(){
  const R = REGIME;
  const upRatio = R.breadth;
  let state, color, desc, open=[], off=[];
  // 1. 判断趋势/震荡
  const trending = R.adx>=25 && R.idxVsMa>0 && R.ma20Slope>0;
  const ranging = R.adx<22 || (R.idxVsMa>0 && R.idxVsMa<1);
  // 2. 风险偏好
  const risk = R.riskOn && R.limitUp>=40 && R.breakRate<=30 && upRatio>=1.2;
  const defensive = R.limitDown>=15 || upRatio<0.8;
  // 3. 波动状态
  const volExpand = R.bbWidth>=2.5 && R.adx>=25;
  const volContract = R.bbWidth<1.5;
  // 综合
  if(trending && risk && volExpand){ state='趋势扩张'; color='var(--up)'; desc='动量/趋势策略有效窗口：追强势主线、板块龙头'; open=['形态突破波段(打法1)','连板/涨停回踩短线','中长线右侧确认埋伏']; off=['抄底超跌','逆势做空']; }
  else if(trending && risk){ state='趋势市'; color='var(--up)'; desc='趋势延续，动量有效但注意别追高'; open=['回踩低吸波段(打法2)','平台突破','龙头跟随']; off=['震荡高抛低吸']; }
  else if(ranging && risk){ state='震荡偏多'; color='var(--accent)'; desc='区间行情，赚波段不赚趋势'; open=['低波动区间套利(打法2)','均线低吸高抛','高股息压舱']; off=['追涨停/连板','追突破']; }
  else if(ranging){ state='震荡市'; color='var(--accent)'; desc='箱体震荡，动量策略失效=送钱，只做均值回归'; open=['红利低波压舱','区间高抛低吸','空仓等待']; off=['形态突破追高','短线连板','动量追涨']; }
  else if(defensive){ state='防御市'; color='var(--down)'; desc='风险偏好收缩，减仓防守，现金为王'; open=['红利低波','空仓等待','轻仓试错']; off=['短线全仓','追高','抄底下跌中继']; }
  else { state='波动收缩/蓄势'; color='var(--accent)'; desc='量能收缩等待方向选择，轻仓观察'; open=['低波动套利','观望等待突破']; off=['重仓','追突破']; }
  return {state, color, desc, open, off};
}

// 持仓指标同步：每次加载用 POSITIONS 最新 indicators 刷新 state 持仓的 ind（不覆盖用户手调 shares/cost/now）
function syncPosIndicators(){
  const map = {};
  (POSITIONS||[]).forEach(p=>{ if(p&&p.code) map[p.code]=p.indicators; });
  (state.positions||[]).forEach(pos=>{
    if(map[pos.code]){
      // 行情指标整体采用最新核验数据（POSITIONS.indicators），确保 adx/cci/wr 等新字段同步到位
      pos.ind = map[pos.code];
    }
  });
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

// ===== 工具 =====
function fmtChg(v){ return (v>=0?'+':'')+v.toFixed(2)+'%'; }
// ind 安全渲染：缺字段/字符串/NaN 一律显示 '—'，避免 undefined
function num(v){ return (typeof v==='number' && !isNaN(v)) ? v : null; }
function fnum(v,d){ const n=num(v); return n!=null?n.toFixed(d):'—'; }
function indVal(p,k,d){ const n=num(p.ind&&p.ind[k]); return n!=null?n.toFixed(d):'—'; }
function indCls(p,k,hi,lo){ const n=num(p.ind&&p.ind[k]); if(n==null) return 'flat'; return n>=hi?'up':(lo!=null&&n<=lo?'down':'flat'); }
// 阿布价格行为学 PA 评分（0-100）：K线结构健康度
// 基于指标推导的价格行为健康度，非固定值，随 ind 数据更新
function paScore(p){
  // 价格行为健康度。权重依据 2026-09-04 因子验证（400只全市场 fwd20 IC，行业+市值中性化后仍显著）：
  // 反转/低吸=真alpha（mom60 -0.073 / bounce -0.073 / vol20 -0.063 中性后仍负），追强=负贡献（pos60 -0.045 / macd_gt0 -0.070）。
  // 故：追强类（macd>0 / ADX强 / 高位）降权，反转类（超卖 / 低位 / 低波动）加权。
  const I = p.ind||p.indicators||{};
  let s = 50;
  const macd = num(I.macd), kdj = num(I.kdj), cci = num(I.cci), adx = num(I.adx), pdi = num(I.pdi), mdi = num(I.mdi), wr = num(I.wr), vr = num(I.vr), turn = num(I.turnover), pos60 = num(I.pos60), vol = num(I.vol);
  // 追强降权（macd_gt0 IC=-0.070 负贡献；右侧反转只需确认拐头，不必强多头）
  if(macd!=null && macd>0) s += 5; else if(macd!=null) s -= 3;
  // DMI双线：方向过滤保留，但趋势强度加分下调（弱市追强=负alpha）
  if(pdi!=null && mdi!=null && adx!=null){ if(pdi>mdi && adx>=25) s += 5; else if(adx>=25 && pdi<=mdi) s -= 6; }
  else if(adx!=null && adx>=25) s += 3;   // 无±DI时单ADX无方向，微调
  if(kdj!=null && kdj>90) s -= 8;       // 超买/高潮嫌疑
  if(kdj!=null && kdj<15) s += 7;       // 超卖企稳（反转证据支持）
  if(cci!=null && cci>200) s -= 6;      // 高潮放量
  if(vr!=null && vr>3) s -= 6;          // 突发巨量=出货/对倒嫌疑
  if(vr!=null && vr>=1 && vr<=2) s += 5;// 温和放量健康
  if(wr!=null && wr>85) s -= 5;         // 超买
  if(turn!=null && turn>10) s -= 6;     // 高换手投机
  if(turn!=null && turn>=0.3 && turn<=5) s += 5; // 健康换手
  // 低位反转加权（pos60 反转证据：追高负贡献、低位正贡献）
  if(pos60!=null){ if(pos60<30) s += 5; else if(pos60>80) s -= 5; }
  // 低波动加权（vol20 中性化后衰减仅12%=最纯粹alpha）
  if(vol!=null){ if(vol<0.40) s += 4; else if(vol>0.80) s -= 3; }
  return Math.max(20, Math.min(95, s));
}

// 逃顶/持有信号（2026-09-08 信号库 S6/S7/S2/S26；S24 烧香线由 __sptCheckIncense 异步补充）
// 优先级：逃顶类(S7/S24/S26/S2) > 止损纪律 > 买入类；触发即至少减半
function escapeSignals(p){
  var out=[];
  if(!p||!p.code) return out;
  var I=p.ind||p.indicators||{};
  var chg=parseFloat(p.chg)||0, vr=parseFloat(I.vr)||0;
  var pos60 = num(I.pos60)!=null ? I.pos60 : (num(p.p60)!=null?p.p60:null);
  var pos30 = num(I.pos30)!=null ? I.pos30 : null;
  var posHi = (pos30!=null&&pos60!=null)?Math.max(pos30,pos60):(pos60!=null?pos60:pos30);
  var cci = num(I.cci)!=null ? I.cci : (num(p.cci)!=null?p.cci:null);
  // 20日涨幅（S7 用：区分'涨上来的高位'与'横盘箱体上沿'，2026-09-08 修正）
  function chg20Of(pp){
    var I2=pp.ind||pp.indicators||{};
    var v=num(I2.chg20); if(v!=null) return v;
    v=num(pp.chg20); if(v!=null) return v;
    try{
      if(typeof kCacheGet==='function'){
        var bs=kCacheGet(pp.code);
        if(bs&&bs.length>=21&&bs[bs.length-21][2]>0) return (bs[bs.length-1][2]/bs[bs.length-21][2]-1)*100;
      }
    }catch(e){}
    return null;
  }
  var c20 = chg20Of(p);
  // S7 高位放量滞涨（2026-09-08 收紧）：max(30/60日位置)>=75 + 量比>=3(显著放量) + 涨幅<0.5%(真滞涨) + 20日涨幅>=10%(排除横盘蓝筹/深坑低位假高位)
  if(posHi!=null && posHi>=75 && vr>=3 && chg<0.5 && c20!=null && c20>=10)
    out.push({k:'S7',name:'高位放量滞涨',cls:'escape',kind:'top',desc:'30/60日位置'+posHi.toFixed(0)+'% · 量比'+vr.toFixed(2)+' · 涨幅'+fmtChg(chg)+' · 20日+'+c20.toFixed(0)+'%，高位滞涨'});
  // S26 子午峰值下拐：高位(60日位置>=70) + CCI>150 且当日回落/走平
  // 2026-09-08 修正：中低位 CCI 脉冲不算顶（误报案例：汽轮科技300277 60日位置38%、90日跌28.6%，
  // 深调后单日放量反弹拉爆CCI163；位置是逃顶第一前提，CCI单独不构成逃顶依据）
  if(cci!=null && cci>150 && chg<=0 && pos60!=null && pos60>=70)
    out.push({k:'S26',name:'子午峰值下拐',cls:'escape',kind:'top',desc:'CCI '+cci.toFixed(0)+' 高位回落'+(chg<0?(' '+fmtChg(chg)):'')+' · 60日位置'+pos60.toFixed(0)+'%'});
  // S2 趋势破坏：均线空头/破位（pos 字段已有下降/破止损标记）
  // 2026-09-10 修正：加位置约束 posHi>=50 —— 低位超跌空头≠逃顶（误报案例=山东高速600350 60日位置3.4%）
  if(posHi!=null && posHi>=50 && (String(p.pos||'').indexOf('下降')>=0||String(p.pos||'').indexOf('破')>=0))
    out.push({k:'S2',name:'趋势破坏',cls:'escape',kind:'trend',desc:'高位('+posHi.toFixed(0)+'%) 均线转空/破位：'+String(p.pos||'').slice(0,14)});
  // S6 缩量锁筹：上涨+量比<1+位置不高 -> 健康持有
  if(chg>1 && vr>0 && vr<1 && (pos60==null||pos60<70))
    out.push({k:'S6',name:'缩量锁筹',cls:'hold',kind:'hold',desc:'量比'+vr.toFixed(2)+' 缩量上涨，主力锁筹·继续持有'});
    // S33 主力阶段鉴别（药无敌四步法：①下杀洗盘②套牢消耗③区间吸筹④放量拉升；高位=派发风险）
  var c3 = (typeof CYCLE3!=='undefined') ? CYCLE3[p.code] : null;
  if(c3){
    if(c3.st && (String(c3.st).indexOf('派发')>=0 || c3.w==='派发·滞涨' || c3.w==='派发·回落'))
      out.push({k:'S33',name:'主力派发',cls:'escape',kind:'top',desc:'主力阶段'+c3.st+'·周线'+c3.w+'，高位派发风险，逃顶加权'});
    else if(c3.st && (String(c3.st).indexOf('吸筹')>=0 || String(c3.st).indexOf('下杀')>=0 || String(c3.st).indexOf('消耗')>=0))
      out.push({k:'S33b',name:'主力吸筹/洗盘',cls:'hold',kind:'wash',desc:'主力阶段'+c3.st+'·周线'+c3.w+'，回调多为洗盘性质（非逃顶）'});
  }
    // @蚂蚁体系（2026-09-10 S39，信号库八类）：高位+放量回落=拐头迹象，不要吃最后一口
  if(posHi!=null && posHi>=75 && chg<=-1 && vr>=1.5)
    out.push({k:'M39',name:'拐头回落·不贪最后一口',cls:'escape',kind:'top',desc:'60日位置'+posHi.toFixed(0)+'% 高位拐头'+fmtChg(chg)+' · 量比'+vr.toFixed(2)+' · 蚂蚁S39：不要吃最后一口'});
  return out;
}

// 全仓逃顶扫描：持仓 + 候选池（同步信号 + 触发烧香线异步检测）
function scanEscape(){
  var out=[];
  var seen={};
  function add(p,pool){
    if(!p||!p.code) return;
    if(window.__sptCheckIncense){ try{ window.__sptCheckIncense(p.code); }catch(e){} }
    escapeSignals(p).forEach(function(s){
      if(s.cls==='escape' && !seen[p.code+'|'+s.k]){
        seen[p.code+'|'+s.k]=1;
        out.push({code:p.code,name:p.name||p.code,pool:pool||'持仓',sig:s,nowTxt:num(p.now)!=null?p.now.toFixed(2):''});
      }
    });
  }
  (state.positions||[]).forEach(function(p){ add(p,'持仓'); });
  var pools=[typeof FAREAST_POOL!=='undefined'?FAREAST_POOL:null, typeof SWING_POOL!=='undefined'?SWING_POOL:null,
    typeof SHORT_POOL!=='undefined'?SHORT_POOL:null, (typeof TIERS!=='undefined'&&TIERS.mid)?TIERS.mid:null,
    (typeof TIERS!=='undefined'&&TIERS.swing)?TIERS.swing:null, (typeof TIERS!=='undefined'&&TIERS.short)?TIERS.short:null,
    typeof NZI_POOL!=='undefined'?NZI_POOL:null, typeof CCI_POOL!=='undefined'?CCI_POOL:null, typeof ADX_POOL!=='undefined'?ADX_POOL:null];
  pools.forEach(function(pl){ (pl||[]).forEach(function(c){ add(c, c.pool||'候选'); }); });
  return out;
}
// 洗盘 vs 出货 5维判定（临昇思路：看位置/量能/均线/筹码/K线，区分真埋伏与"深调但几年起不来"的出货）
// p: {position:'high'|'mid'|'low', 距高点回撤%, chg当日涨跌, vr量比, turn换手, maStatus:'hold'|'break'|'below', chipChange:'up'|'flat'|'down', kline:'shake'|'dump'}
function washoutJudge(p){
  const d = p||{};
  let score = 0, notes = [];
  // 1) 位置：出货多在高位（累计涨幅大），洗盘多在上涨中途/低位
  const posScore = (d.position==='low'||d.position==='mid') ? 20 : (d.position==='high'?5:10);
  score += posScore;
  notes.push((d.position==='low'?'低位启动':'')+(d.position==='mid'?'上涨中途':'')+(d.position==='high'?'高位大涨':'未定')+':'+(posScore>=15?'像洗盘':'警惕出货'));
  // 2) 量能：洗盘缩量跌（量比低），出货放量跌（量比高/巨量阴线）
  const vr = num(d.vr), chg = num(d.chg);
  let vScore = 10;
  if(vr!=null && chg!=null && chg<0){ vScore = (vr<1.5)?20:((vr>2.5)?5:13); }   // 下跌缩量=洗盘，放量急跌=出货
  else if(vr!=null){ vScore = (vr>=0.8&&vr<=2)?18:((vr>2.5)?10:15); }
  score += vScore;
  notes.push('量能:量比'+(vr!=null?vr:'—')+(chg!=null&&chg<0?'且下跌':'')+':'+(vScore>=15?'缩量健康(像洗盘)':'放量警惕(像出货)'));
  // 3) 均线：洗盘不破中期均线（20/30/60日），出货全破
  const maScore = (d.maStatus==='hold')?20:((d.maStatus==='below')?5:12);
  score += maScore;
  notes.push('均线:'+(d.maStatus==='hold'?'守住20/30日线(像洗盘)':(d.maStatus==='below'?'跌破中期均线(警惕出货)':'中期均线附近'))+':'+maScore);
  // 4) 筹码：洗盘筹码锁定（股东户数降），出货筹码松动
  const chipScore = (d.chipChange==='up')?20:((d.chipChange==='down')?5:12);
  score += chipScore;
  notes.push('筹码:'+(d.chipChange==='up'?'集中(户数降,像洗盘)':(d.chipChange==='down'?'松动(户数增,警惕出货)':'中性'))+':'+chipScore);
  // 5) K线：洗盘小阴线/长下影/企稳，出货大阴线破位/低点下移
  const kScore = (d.kline==='shake')?20:((d.kline==='dump')?5:12);
  score += kScore;
  notes.push('K线:'+(d.kline==='shake'?'小阴线+下影线企稳(像洗盘)':(d.kline==='dump'?'大阴线+低点下移(警惕出货)':'中性'))+':'+kScore);
  const verdict = score>=75?'洗盘(可埋伏)':(score>=55?'洗盘/出货临界(观察)':'出货(回避)');
  return { score, verdict, notes };
}
// 简化PA评分：波段池无完整ind，用 量比vr/换手turn/涨幅chg 推导
function paScoreLite(c){
  let s = 50;
  const vr = num(c.vr), turn = num(c.turn), chg = num(c.chg);
  if(vr!=null && vr>=1 && vr<=2) s += 10; else if(vr!=null && vr>3) s -= 10; else if(vr!=null && vr>2) s -= 3;
  if(turn!=null && turn>=0.3 && turn<=5) s += 8; else if(turn!=null && turn>10) s -= 8; else if(turn!=null && turn>8) s -= 3;
  if(chg!=null && chg>=5 && chg<9.5) s += 8;      // 强势启动未封板
  else if(chg!=null && chg>=9.5) s -= 6;           // 已涨停/接近涨停=追高风险
  else if(chg!=null && chg<0) s -= 4;
  return Math.max(20, Math.min(95, s));
}
// 通用PA评分：兼容各战法池字段（vr/turn/chg/cci/adx/dy/vol），缺字段自动跳过
function paScoreAny(c){
  let s = 50;
  const vr=num(c.vr), turn=num(c.turn), chg=num(c.chg), cci=num(c.cci), adx=num(c.adx), dy=num(c.dy), vol=num(c.vol);
  if(vr!=null && vr>=1 && vr<=2) s+=10; else if(vr!=null && vr>3) s-=10; else if(vr!=null && vr>2) s-=3;
  if(turn!=null && turn>=0.3 && turn<=5) s+=8; else if(turn!=null && turn>10) s-=8; else if(turn!=null && turn>8) s-=3;
  if(chg!=null && chg>=5 && chg<9.5) s+=8; else if(chg!=null && chg>=9.5) s-=6; else if(chg!=null && chg<0) s-=4;
  if(cci!=null && cci>100) s-=4; else if(cci!=null && cci<-100) s-=3;
  if(adx!=null && adx>=25) s+=6; else if(adx!=null && adx<20) s-=3;
  if(dy!=null && dy>=4) s+=8; else if(dy!=null && dy<2) s-=4;
  if(vol!=null && vol>=2 && vol<3) s+=6; else if(vol!=null && vol>=3) s-=3;
  return Math.max(20, Math.min(95, s));
}
function paCell(s){
  const ps = paScoreAny(s);
  const col = ps>=70?'var(--up)':ps>=55?'var(--accent)':'var(--down)';

}

function findQuote(code){

function emSecid(code){ code=String(code).replace(/\D/g,''); return (code.charAt(0)==='6'||code.charAt(0)==='9')?'1.'+code:'0.'+code; }
function fetchFlowDaily(code){
  var ck='spt_flow_'+code;
  try{ var c=JSON.parse(localStorage.getItem(ck)); if(c&&c.t&&c.rows&&c.rows.length){ var t1=new Date(c.t), t2=new Date(); if(t1.getFullYear()===t2.getFullYear()&&t1.getMonth()===t2.getMonth()&&t1.getDate()===t2.getDate()) return Promise.resolve(c.rows); } }catch(e){}
  var secid=emSecid(code);
  var url='https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get?lmt=6&klt=101&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64,f65&secid='+secid;
  return fetch(url,{headers:{'Referer':'https://quote.eastmoney.com/'}}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.data||!j.data.klines||!j.data.klines.length) return null;
    var rows=j.data.klines.map(function(l){ var p=String(l).split(','); return {date:p[0], main:+p[1], small:+p[2], mid:+p[3], big:+p[4], xl:+p[5], pct:+p[6], close:+p[11], chg:+p[12]}; });
    try{ localStorage.setItem(ck, JSON.stringify({t:new Date(), rows:rows})); }catch(e){}
    return rows;
  }).catch(function(){ return null; });
}

// 波段操作分 = 质地分(含战法) + 60日位置调整——位置越低越值得买，越高越不推荐（波段=低位买高卖）
function swingOpScore(c){
  var base = (c.score!=null?c.score:60) + (c.tact?3:0);
  var p = c.p60!=null ? c.p60 : 50;
  var adj = 0;
  if(p<20) adj=15; else if(p<40) adj=8; else if(p<60) adj=0; else if(p<80) adj=-10; else adj=-20;
  if((c.pos||'').indexOf('下降')>=0) adj-=25;
  if((c.pos||'').indexOf('破止损')>=0) adj-=25;
  var op = base+adj;
  return op<0?0:Math.round(op);
}

// ===== 信号捕捉：盘中实时扫描三重仓开仓信号（14:30-14:55尾盘窗口重点）=====
function parseBuyRange(buy){
  // buy 可能是 '12.2-12.5' 区间 或 12.2 数值
  if(typeof buy==='number') return {lo:buy, hi:buy};
  var s=String(buy||'').replace(/[^\d.\-~至→]/g,'');
  var m=s.match(/(\d+\.?\d*)\s*[-~至→]\s*(\d+\.?\d*)/);
  if(m) return {lo:parseFloat(m[1]), hi:parseFloat(m[2])};
  var n=parseFloat(s);
  return isNaN(n)?null:{lo:n,hi:n};
}
function sigPoolTag(pool){

}

function fmtRange(buy){
  if(typeof buy==='number') return buy.toFixed(2);
  var s=String(buy||'').trim();
  return s.indexOf('-')>=0||s.indexOf('~')>=0?s:s.replace(/(\d+\.?\d*)([^0-9.]|$)/g,'$1');
}
// 全池扫描：三重仓 + 各战法池
function scanSignals(){
  var out={strong:[], weak:[]};
  var pools=[
    {list:typeof FAREAST_POOL!=='undefined'?FAREAST_POOL:[], name:'埋伏池'},
    {list:typeof SWING_POOL!=='undefined'?SWING_POOL:[], name:'波段池'},
    {list:typeof SHORT_POOL!=='undefined'?SHORT_POOL:[], name:'短线池'},
    {list:(typeof TIERS!=='undefined'&&TIERS.mid)?TIERS.mid:[], name:'中长线池'},
    {list:(typeof TIERS!=='undefined'&&TIERS.swing)?TIERS.swing:[], name:'波段池'},
    {list:(typeof TIERS!=='undefined'&&TIERS.short)?TIERS.short:[], name:'短线池'},
  ];
  var seen={}, seenStrong={}, hitCnt={};
  var PRIO={buy:0,launch:1,break:2,cci:3,low:4,near:5};
  pools.forEach(function(p){
    (p.list||[]).forEach(function(c){
      if(!c||!c.code) return;
      sigOfStock(c,p.name).forEach(function(s){
        var item={code:c.code,name:c.name||c.code,pool:p.name,sig:s,nowTxt:(typeof c.now==='number')?c.now.toFixed(2):''};
        var k=c.code+s.key;
        if(seen[k]) return; seen[k]=1;
        hitCnt[c.code]=(hitCnt[c.code]||0)+1;
        if(s.type==='strong'){
          // 同一票只保留一个强信号（优先级最高）
          if(seenStrong[c.code]!=null){
            var oldItem=seenStrong[c.code];
            if((PRIO[s.key]||9) >= (PRIO[oldItem.sig.key]||9)) return;
            out.strong=out.strong.filter(function(x){return x.code!==c.code;});
          }
          seenStrong[c.code]=item;
          out.strong.push(item);
        } else {
          out.weak.push(item);
        }
      });
    });
  });
  // 逃顶压制（2026-09-08 修复B：信号库铁律"逃顶S7/S24/S26/S2 优先于一切买入"，命中即移出开仓池）
  var esc={};
  function _escCollect(p){
    if(!p||!p.code) return;
    escapeSignals(p).forEach(function(s){
      if(s.cls==='escape' && !esc[p.code]) esc[p.code]=s;
    });
  }
  (state.positions||[]).forEach(function(p){_escCollect(p);});
  var escPools=[typeof FAREAST_POOL!=='undefined'?FAREAST_POOL:null, typeof SWING_POOL!=='undefined'?SWING_POOL:null,
    typeof SHORT_POOL!=='undefined'?SHORT_POOL:null, (typeof TIERS!=='undefined'&&TIERS.mid)?TIERS.mid:null,
    (typeof TIERS!=='undefined'&&TIERS.swing)?TIERS.swing:null, (typeof TIERS!=='undefined'&&TIERS.short)?TIERS.short:null,
    typeof NZI_POOL!=='undefined'?NZI_POOL:null, typeof CCI_POOL!=='undefined'?CCI_POOL:null, typeof ADX_POOL!=='undefined'?ADX_POOL:null];
  escPools.forEach(function(pl){(pl||[]).forEach(function(c){_escCollect(c);});});
  out.escapeBlocked=[];
  out.strong=out.strong.filter(function(it){
    if(esc[it.code]){ out.escapeBlocked.push({code:it.code,name:it.name,sig:esc[it.code]}); return false; }
    return true;
  });
  // 多池共振标记
  var cnt={};
  out.strong.forEach(function(it){ cnt[it.code]=(cnt[it.code]||0)+1; });
  out.strong.forEach(function(it){ if(cnt[it.code]>=2) it.resonance=true; });
  // 2026-09-10 信号共振计数（workbuddy x/N 模式）：命中信号总条数(强+弱)
  out.strong.forEach(function(it){ it.hitN=hitCnt[it.code]||0; });
  out.weak.forEach(function(it){ it.hitN=hitCnt[it.code]||0; });
  return out;
}
function sigCard(it){

  var cls = s.type==='weak' ? 'yellow' : (s.flash===false ? 'green' : 'red');
  var badgeCls = cls==='red'?'red-b':cls==='green'?'green-b':'yellow-b';
  var res = it.resonance?'<span class="badge b-tag" style="font-size:9.5px;padding:1px 6px;">共振</span>':'';

      <span class="sig-name">${it.name}</span>

function tailSignalRows(){
  var rows=[];
  var pools={};
  function rng(buy){
    if(buy==null||buy==='') return null;
    var b=String(buy);
    var m=b.match(/([\d.]+)\s*[-~]\s*([\d.]+)/);
    if(m) return [parseFloat(m[1]),parseFloat(m[2])];
    var n=parseFloat(b);
    return isNaN(n)?null:[n,n];
  }
  function push(c,pool,sig,px,chg,vr,turn,buy){
    rows.push({code:c.code,name:c.name,pool:pool,sig:sig,px:px,chg:chg,vr:vr,turn:turn,buy:buy});
    (pools[c.code]=pools[c.code]||{})[pool]=1;
  }
  function rtOf(c){
    var g=window['v_'+rtCode(c.code)];
    if(!g) return null;
    var r=rtParseStr(g);
    return (r&&r.now>0)?r:null;
  }
  // 埋伏池：回踩买点区 / 站上MA20 / 站上MA60
  (FAREAST_POOL||[]).forEach(function(c){
    var r=rtOf(c); if(!r) return;
    var sigs=[], br=rng(c.buy);
    if(br && r.now>=br[0] && r.now<=br[1]*1.02) sigs.push('回踩买点区');
    var ma20=parseFloat(c.ma20), ma60=parseFloat(c.ma60);
    if(!isNaN(ma20) && r.now>=ma20) sigs.push('站上MA20');
    if(!isNaN(ma60) && r.now>=ma60) sigs.push('站上MA60');
    if(sigs.length) push(c,'埋伏池',sigs.join('+'),r.now,r.prev?(r.now-r.prev)/r.prev*100:0,r.vr,r.turnover,c.buy);
  });
  // 波段池：破止损 / 触达低吸位±2% / 接近低吸位+6% / 60日低吸区
  (SWING_POOL||[]).forEach(function(c){
    var r=rtOf(c); if(!r) return;
    var buy=parseFloat(c.buy), stop=parseFloat(c.stop), p60=parseFloat(c.p60), sigs=[];
    if(!isNaN(stop) && r.now<=stop) sigs.push('破止损');
    else if(!isNaN(buy) && r.now>=buy*0.98 && r.now<=buy*1.02) sigs.push('触达低吸位');
    else if(!isNaN(buy) && r.now>buy && r.now<=buy*1.06) sigs.push('接近低吸位');
    if(!isNaN(p60) && p60<40) sigs.push('低吸区');
    if(sigs.length) push(c,'波段池',sigs.join('+'),r.now,r.prev?(r.now-r.prev)/r.prev*100:0,r.vr,r.turnover,isNaN(buy)?c.buy:buy.toFixed(2));
  });
  // 短线池：回踩到位 / 跌破买点区 / 放量（量比≥2）
  (SHORT_POOL||[]).forEach(function(c){
    var r=rtOf(c); if(!r) return;
    var br=rng(c.buy), sigs=[];
    if(br){
      if(r.now>=br[0]*0.98 && r.now<=br[1]) sigs.push('回踩到位');
      else if(r.now<br[0]*0.98) sigs.push('跌破买点区');
    }
    if(r.vr>=2) sigs.push(r.chg>0?'放量上攻':'放量');
    if(sigs.length) push(c,'短线池',sigs.join('+'),r.now,r.prev?(r.now-r.prev)/r.prev*100:0,r.vr,r.turnover,c.buy);
  });
  // 多池共振：同一代码在 ≥2 池同时触发
  rows.forEach(function(x){ if(Object.keys(pools[x.code]||{}).length>=2) x.res=1; });
  return rows;
}

// ===== 模拟仓 =====
function simPrice(code){
  // 从所有池/持仓找现价
  const all = [...TIERS.mid,...TIERS.swing,...TIERS.short,...DIVIDEND_POOL,...SMALLCAP_POOL,...NZI_POOL,...CCI_POOL,...ADX_POOL,...SWING_POOL,...FAKEYIN_POOL,...ONELINE_POOL];
  const c = all.find(x=>x.code===code);
  if(c && c.now) return c.now;
  const p = state.positions.find(x=>x.code===code);
  return p?p.now:0;
}
function simBuy(code, shares){
  const s = state.sim;
  const price = simPrice(code);
  if(!price || shares<=0) return;
  const cost = price*shares;
  if(cost > s.cash) return;
  s.cash -= cost;
  const ex = s.positions.find(x=>x.code===code);
  if(ex){
    const oldVal = ex.cost*ex.shares;
    const newShares = ex.shares+shares;
    ex.cost = (oldVal+cost)/newShares;
    ex.shares = newShares;
  }else{
    s.positions.push({code, name:(()=>{const all=[...TIERS.mid,...TIERS.swing,...TIERS.short,...DIVIDEND_POOL,...SMALLCAP_POOL,...NZI_POOL,...CCI_POOL,...ADX_POOL,...SWING_POOL,...FAKEYIN_POOL,...ONELINE_POOL];const c=all.find(x=>x.code===code);return c?c.name:code;})(), shares, cost:price, now:price});
  }
  save();
}
function simSell(code, shares){
  const s = state.sim;
  const ex = s.positions.find(x=>x.code===code);
  if(!ex) return;
  const price = simPrice(code);
  const sellShares = shares>0?Math.min(shares,ex.shares):ex.shares;
  if(sellShares<=0) return;
  s.cash += price*sellShares;
  ex.shares -= sellShares;
  if(ex.shares<=0) s.positions = s.positions.filter(x=>x.code!==code);
  else{ ex.cost = ex.cost; }
  save();
}
// 自动买入：按三重仓规则，从各池最高分选未持仓买入
function simAutoBuy(){
  const s = state.sim;
  if(!s.autoBuy) return 0;
  // 中长线50%：红利低波+CCI+ADX 高分
  const midTarget = s.principal*0.5;
  const midNow = s.positions.filter(p=>['600941','000651','601088','600036','601006','000895','600066','600219','600023','601668','688668','002993','002733'].includes(p.code)).reduce((a,p)=>a+p.cost*p.shares,0);
  // 波段30%：N字+CCI
  // 短线20%：小市值
  const buyList = [];
  // 中长线候选（红利低波前5）
  DIVIDEND_POOL.slice(0,5).forEach(c=>{ if(!s.positions.some(p=>p.code===c.code)) buyList.push({code:c.code, tier:'mid'}); });
  // 波段候选（SWING_POOL 前3高分）
  SWING_POOL.slice().sort((a,b)=>swingOpScore(b)-swingOpScore(a)).slice(0,3).forEach(c=>{ if(!s.positions.some(p=>p.code===c.code)) buyList.push({code:c.code, tier:'swing'}); });
  // 短线候选（小市值前2）
  SMALLCAP_POOL.slice(0,2).forEach(c=>{ if(!s.positions.some(p=>p.code===c.code)) buyList.push({code:c.code, tier:'short'}); });
  let n=0;
  buyList.forEach(b=>{
    const price = simPrice(b.code);
    if(!price) return;
    // 按层分配资金：中长线单票10%、波段单票10%、短线单票5%
    const alloc = b.tier==='mid'? s.principal*0.10 : b.tier==='swing'? s.principal*0.10 : s.principal*0.05;
    const shares = Math.floor(alloc/price/100)*100;
    if(shares>0){ simBuy(b.code, shares); n++; }
  });
  return n;
}

// 收盘后自动调仓：止盈/止损/换仓（仅15:05后执行，同日一次）
function simAutoAdjust(){
  const s = state.sim;
  if(!s.autoBuy) return {buy:0, sell:0, logs:[]};
  const now = new Date();
  const hh = now.getHours()*60+now.getMinutes();
  if(hh < 15*60+5) return {buy:0, sell:0, logs:[]}; // 未到收盘后，不动
  const today = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  if(s.lastAdjustDate===today) return {buy:0, sell:0, logs:[]}; // 当日已调
  const poolAll = [...DIVIDEND_POOL,...SMALLCAP_POOL,...NZI_POOL,...CCI_POOL,...ADX_POOL,...SWING_POOL,...FAKEYIN_POOL,...ONELINE_POOL, ...(TIERS.mid||[]), ...(TIERS.short||[])];
  const logs = []; let sellN=0;
  // 1) 止盈/止损扫描：现价>=target 或 <=stop → 清仓
  s.positions = s.positions.filter(p=>{
    const pc = poolAll.find(x=>x.code===p.code);
    if(!pc) return true;
    let target=0, stop=0;
    if(typeof pc.target==='number') target=pc.target;
    else if(pc.target) target = parseFloat(String(pc.target).replace(/[^0-9.]/g,''))||0;
    if(typeof pc.stop==='number') stop=pc.stop;
    else if(pc.stop) stop = parseFloat(String(pc.stop).replace(/[^0-9.]/g,''))||0;
    const price = simPrice(p.code);
    const px = price||p.now;
    let reason='';
    if(target>0 && px>=target){ reason='止盈'; }
    else if(stop>0 && px<=stop){ reason='止损'; }
    if(reason){
      const amt = px*p.shares;
      s.cash += amt;
      s.history.push({date:today, type:reason, code:p.code, name:p.name, shares:p.shares, price:px, amt:Math.round(amt)});
      logs.push({code:p.code, name:p.name, action:reason, px:px});
      sellN++;
      return false;
    }
    return true;
  });
  // 2) 空仓资金再买入（复用规则）
  const before = s.positions.length;
  let buyN = 0;
  try{ buyN = simAutoBuy(); }catch(e){}
  const after = s.positions.length;
  s.lastAdjustDate = today;
  save();
  return {buy:buyN, sell:sellN, logs};
}

function arbitrate(c){
  if(!c||!c.code) return null;
  var now=parseFloat(c.now); if(isNaN(now)) return null;
  var br=parseBuyRange(c.buy);
  var stop=parseFloat(c.stop), target=parseFloat(String(c.target).split('→')[0]);
  var pos60=parseFloat(c.pos60); if(isNaN(pos60)) pos60=50;
  var cci=parseFloat((c.ind&&c.ind.cci)!=null?c.ind.cci:c.cci); if(isNaN(cci)) cci=0;
  var kdj=parseFloat((c.ind&&c.ind.kdj)!=null?c.ind.kdj:c.kdj); if(isNaN(kdj)) kdj=50;
  var vr=parseFloat(c.vr); if(isNaN(vr)) vr=1;
  var chg=parseFloat(c.chg); if(isNaN(chg)) chg=0;
  var ma20=parseFloat(c.ma20), ma60=parseFloat(c.ma60);
  var vg=c.vg||null;
  // ① 止损离场（最高优先级：到止损无条件执行）
  if(!isNaN(stop)&&stop>0&&now<=stop) return {st:'离场·破止损',cls:'sell',reason:'现价 '+now.toFixed(2)+' ≤ 止损 '+stop.toFixed(2)+'，纪律无条件执行，不摊平不等回本'};
  // ② 逃顶压制（第二优先级：位置+高位指标回落，压制一切买入信号）
  var esc=(pos60>=70&&cci>150&&chg<0)||(pos60>=60&&kdj>85&&chg<0);
  if(esc) return {st:'减仓·逃顶压制',cls:'sell',reason:'60日位置 '+pos60.toFixed(0)+'% 高位 + '+(cci>150?('CCI'+cci.toFixed(0)):('KDJ'+kdj.toFixed(0)))+' 高位回落，逃顶信号优先于买入信号'};
  // ③ 止盈区（不贪最后一口）
  if(!isNaN(target)&&target>0&&now>=target*0.97) return {st:'止盈区',cls:'warn',reason:'现价接近目标 '+target.toFixed(2)+'，分批止盈或持有'};
  // ④ 买入信号共振（低吸/多头/超卖/Vegas/量能）
  var inBuy=br&&br.lo>0&&now>=br.lo*0.98&&now<=br.hi*1.03;
  var bull=!isNaN(ma20)&&!isNaN(ma60)&&ma20>ma60&&now>ma20;
  var oversell=cci<-100||kdj<20;
  var trend=vg&&(vg.st==='multi'||vg.st==='cross');
  var vol=vr>1.5;
  var res=0, rsn=[];
  if(inBuy){res++;rsn.push('低吸位'+c.buy);}
  if(bull){res++;rsn.push('均线多头');}
  if(oversell){res++;rsn.push('超卖回踩');}
  if(trend){res++;rsn.push('Vegas趋势');}
  if(vol){res++;rsn.push('量能活跃');}
  if(res>=3) return {st:'可低吸',cls:'buy',reason:rsn.join(' + ')+'（共振'+res+'项）'};
  if(res===2) return {st:'关注',cls:'acc',reason:rsn.join(' + ')+'（共振'+res+'项）'};
  if(inBuy) return {st:'低吸区',cls:'acc',reason:'现价在买入区间 '+c.buy+' 内'};
  return {st:'观望',cls:'wait',reason:'信号不足，等待右侧确认'};
}

function calcPositions(trades){
  var pos={}, order=[];
  trades.forEach(function(t){
    if(!pos[t.code]){ pos[t.code]={code:t.code,name:t.name,cost:0,shares:0,buyAmt:0,pos60:t.pos60,pool:t.pool}; order.push(t.code); }

    else if(t.side==='sell'){ p.shares-=(t.shares||1); if(p.shares<=0){p.shares=0;p.buyAmt=0;} }
    if(p.shares>0) p.cost=p.buyAmt/p.shares;

function discAudit(trades,pos){
  var buys=trades.filter(function(t){return t.side==='buy';});
  var sells=trades.filter(function(t){return t.side==='sell';});
  var chase=buys.filter(function(t){return parseFloat(t.pos60)>70;}).length;
  var chaseRate=buys.length?Math.round(chase/buys.length*100):0;
  var wins=sells.filter(function(t){return t.gain>0;}).length;
  var winRate=sells.length?Math.round(wins/sells.length*100):0;
  var gains=sells.filter(function(t){return t.gain>0;}).map(function(t){return t.gain;});
  var losses=sells.filter(function(t){return t.gain<=0;}).map(function(t){return t.gain;});
  var avgWin=gains.length?gains.reduce(function(a,b){return a+b;},0)/gains.length:0;
  var avgLoss=losses.length?Math.abs(losses.reduce(function(a,b){return a+b;},0)/losses.length):0;
  var pl=avgLoss>0?avgWin/avgLoss:(avgWin>0?3:0);
  var over8=pos.filter(function(p){return p.flLoss>8;}).length;
  var near=pos.filter(function(p){return p.flLoss>=5&&p.flLoss<=8;}).length;
  var noReason=buys.filter(function(t){return !t.reason;}).length;
  var score=Math.max(0,Math.min(100,Math.round(100-chase*15-over8*10-near*5-noReason*5)));
  return {chase:chase,chaseRate:chaseRate,winRate:winRate,pl:pl,over8:over8,near:near,score:score,total:trades.length,buys:buys.length,sells:sells.length};
}

function buyStock(code){
  const all = [...TIERS.mid,...TIERS.swing,...TIERS.short];
  let c = all.find(x=>x.code===code);
  // 因子池回退：红利低波/小市值/N字池
  if(!c){
    const fp = [...DIVIDEND_POOL,...SMALLCAP_POOL,...NZI_POOL,...CCI_POOL,...ADX_POOL,...FAKEYIN_POOL,...ONELINE_POOL];
    const f = fp.find(x=>x.code===code);
    if(f){
      c = {code:f.code,name:f.name,now:f.now,chg:f.chg,plan:{entry:f.now},ind:{macd:'—',kdj:'—',cci:'—',adx:'—',wr:'—',boll:'—',vr:0,turnover:f.turn||0}};
    }
  }
  if(!c) return;
  const now = c.now;
  const entry = (typeof c.plan.entry==='number' && c.plan.entry>0) ? c.plan.entry : now;
  const p = {
    code:c.code,name:c.name,cost:entry,shares:1000,now:now,chg:c.chg,
    prevClose: now/(1+c.chg/100),
    ind:c.ind,
  };
  if(!state.positions.find(x=>x.code===code)){
    state.positions.push(p);
    save(); render(); toast('已买入 '+c.name+'  '+code);
  } else {
    toast(c.name+' 已在持仓中');
  }
}
